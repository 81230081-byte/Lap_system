<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة مختبر الشموخ الطبي</title>

  <!-- المكتبات الأساسية -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- تنسيقات الطباعة -->
  <style>
    @media print {
      .no-print { display: none !important; }
      body * { visibility: hidden; }
      .printable-area, .printable-area *, #report-area, #report-area * { visibility: visible; }
      .printable-area, #report-area { position: absolute; top: 0; right: 0; left: 0; width: 100%; border: none !important; }
      .hidden.print\:block { display: block !important; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <!-- مربع عرض الأخطاء -->
  <div id="debug-box" style="display:none;" class="m-4 p-4 bg-red-100 border-2 border-red-500 text-red-800 rounded-lg text-left font-mono text-sm dir-ltr whitespace-pre-wrap overflow-auto max-h-96"></div>

  <!-- مكان عرض التطبيق -->
  <div id="root"></div>

  <script>
    // 1. محاكي دالة require للمتصفح
    window.require = function(moduleName) {
      if (moduleName === 'react') return window.React;
      if (moduleName === 'react-dom' || moduleName === 'react-dom/client') return window.ReactDOM;
      if (moduleName === '@supabase/supabase-js' || moduleName === 'supabase') return window.supabase;
      if (moduleName === 'lucide-react' || moduleName === 'lucide') return window.lucide;
      return window[moduleName] || {};
    };

    // 2. دالة عرض الأخطاء
    function showError(title, msg) {
      const debugBox = document.getElementById('debug-box');
      if (debugBox) {
        debugBox.style.display = 'block';
        debugBox.innerHTML = `<b style="color:red">[${title}]:</b><br><pre class="mt-2 text-xs overflow-auto">${msg}</pre>`;
      }
    }

    // 3. التقاط أخطاء التشغيل المباشرة
    window.addEventListener('error', function(e) {
      showError('خطأ أثناء التشغيل (Runtime Error)', e.message + (e.filename ? `\nالموقع: ${e.filename}:${e.lineno}` : ''));
    });

    async function launchApp() {
      // قائمة كافة ملفات النظام
      const files = [
        '01-config.js',
        '02-helpers.js',
        '03-ui-kit.jsx',
        '04-login.jsx',
        '05-layout.jsx',
        '06-dashboard.jsx',
        '07-patients.jsx',
        '08-orders-results.jsx',
        '09-inventory.jsx',
        '10-suppliers-purchases.jsx',
        '11-treasury.jsx',
        '12-financial-reports.jsx',
        '13-ledger-and-coa.jsx',
        '14-billing.jsx',
        '15-audit-log.jsx',
        '16-settings.jsx',
        '17-app-shell.jsx',
        '19-appointments.jsx',
        '21-quality-control.jsx',
        '20-main.jsx'
      ];

      let combinedCode = '';

      // جلب وقراءة كافة الملفات
      for (const file of files) {
        try {
          const res = await fetch('./' + file + '?v=' + Date.now());
          if (!res.ok) {
            showError('خطأ تحميل ملف', `تعذر جلب الملف: ${file} (رمز الاستجابة: ${res.status})`);
            return;
          }
          const content = await res.text();
          combinedCode += `\n/* --- File: ${file} --- */\n` + content;
        } catch (err) {
          showError('خطأ في الشبكة', `فشل اتصال جلب الملف: ${file}\n${err.message}`);
          return;
        }
      }

          // تحويل الأكواد وتنفيذها
      try {
        const transformed = Babel.transform(combinedCode, {
          presets: [['react', { runtime: 'classic' }]],
          sourceType: 'script'
        }).code;


        const scriptEl = document.createElement('script');
        scriptEl.text = transformed;
        document.body.appendChild(scriptEl);
      } catch (babelErr) {
        showError('خطأ في بناء الأكواد (Babel Syntax Error)', babelErr.message);
      }
    }

    // بدء التشغيل
    window.addEventListener('DOMContentLoaded', launchApp);
  </script>
</body>
</html>
