function RangeGauge({ value, min, max, critLow, critHigh }) {

        </div>
      </div>
    </div>
  );
}
function RejectDialog({ order, onCancel, onConfirm }) {
  const [reason, setReason] = useState('');
  if (!order) return null;
  return (

        <textarea value={reason} onChange={(e) => setReason(e.target.value)} rows={3} className="w-full px-3 py-2 rounded-md text-sm mb-4" style={inputStyle} placeholder="مثال: قيمة غير منطقية، يُرجى إعادة الفحص" />

        </div>
      </div>
    </div>
  );
}
function usePagination(items, perPage, resetKey) {
  const [page, setPage] = useState(1);
  useEffect(() => { setPage(1); }, [resetKey]);
  const totalPages = Math.max(1, Math.ceil(items.length / perPage));
  const clamped = Math.min(page, totalPages);
  const start = (clamped - 1) * perPage;
  return { page: clamped, setPage, totalPages, pageItems: items.slice(start, start + perPage) };
}
function PaginationBar({ page, totalPages, setPage }) {
  if (totalPages <= 1) return null;
  return (
    <div className="flex items-center justify-between px-4 py-3" style={{ borderTop: `1px solid ${C.line}` }}>
      <button disabled={page <= 1} onClick={() => setPage(page - 1)} className="text-xs font-bold" style={{ color: C.accent, opacity: page <= 1 ? 0.35 : 1 }}>‹ السابق</button>
      <div className="text-xs font-mono" style={{ color: C.inkMuted }}>صفحة {page} من {totalPages}</div>
      <button disabled={page >= totalPages} onClick={() => setPage(page + 1)} className="text-xs font-bold" style={{ color: C.accent, opacity: page >= totalPages ? 0.35 : 1 }}>التالي ›</button>
    </div>
  );
}

function LoginScreen() {

  const submit = async () => {

function Dashboard({ data, setView, setActiveOrderId }) {
  const { patients, catalog, orders, invoices, inventory, auditLog } = data;
  const pendingOrders = orders.filter((o) => o.status === 'pending');
  const pendingReviewOrders = orders.filter((o) => o.status === 'pending_review');
  const collected = invoices.reduce((s, i) => s + invoicePaid(i), 0);
  const lowStock = inventory.filter((i) => i.quantity <= i.threshold);
  const expiringItems = inventory
    .map((i) => ({ item: i, exp: expiryStatus(i.expiry_date) }))
    .filter((x) => x.exp && (x.exp.level === 'expired' || x.exp.level === 'soon'))
    .sort((a, b) => a.exp.days - b.exp.days);

  const flagged = [];
  orders.filter((o) => o.status === 'completed').forEach((o) => {
    const patient = patients.find((p) => p.id === o.patient_id);

      const test = catalog.find((c) => c.id === testId);
      if (!test) return;
      const r = resolveTestRanges(test, patient);
      const status = classifyValue(value, r);
      if (status === 'abnormal' || status === 'critical') flagged.push({ patient: patient?.name, test, value, r, critical: status === 'critical' });

function PatientsView({ patients, orders, actions, askConfirm, onViewOrders, onViewHistory, isManager }) {
  const [showForm, setShowForm] = useState(false);
  const [query, setQuery] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ name: '', age: '', gender: 'ذكر', phone: '' });
  const [error, setError] = useState('');

  const filtered = patients.filter((p) => p.name.includes(query) || (p.phone || '').includes(query));
  const { page, setPage, totalPages, pageItems } = usePagination(filtered, 6, query);

  const resetForm = () => { setForm({ name: '', age: '', gender: 'ذكر', phone: '' }); setEditingId(null); setShowForm(false); setError(''); };
  const startEdit = (p) => { setEditingId(p.id); setForm({ name: p.name, age: String(p.age || ''), gender: p.gender || 'ذكر', phone: p.phone || '' }); setShowForm(true); setError(''); };

  const submit = async () => {
    if (!form.name.trim()) { setError('الاسم الكامل مطلوب'); return; }
    if (!PHONE_RE.test(form.phone.trim())) { setError('رقم الهاتف غير صالح'); return; }
    const age = Number(form.age);
    if (!form.age || isNaN(age) || age < 0 || age > 120) { setError('العمر يجب أن يكون رقماً بين 0 و120'); return; }
    const dup = patients.find((p) => p.id !== editingId && p.name.trim() === form.name.trim() && p.phone.trim() === form.phone.trim());
    if (dup) { setError('يوجد مريض بنفس الاسم ورقم الهاتف'); return; }
    setError('');
    if (editingId) await actions.updatePatient(editingId, { name: form.name.trim(), age, gender: form.gender, phone: form.phone.trim() });
    else await actions.addPatient({ name: form.name.trim(), age, gender: form.gender, phone: form.phone.trim() });
    resetForm();
  };

  const onDelete = (p) => {
    const count = orders.filter((o) => o.patient_id === p.id).length;
    if (count > 0) { setError(`لا يمكن حذف "${p.name}" — لديه ${count} طلب مسجل`); return; }
    askConfirm({ title: 'حذف مريض', message: `هل تريد حذف "${p.name}" نهائياً؟`, danger: true, onConfirm: () => actions.deletePatient(p.id, p.name) });
  };

  return (
    <div className="p-6 space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="text-2xl font-bold" style={{ color: C.ink }}>المرضى <span className="text-sm font-normal" style={{ color: C.inkMuted }}>({patients.length})</span></div>
        <button onClick={() => (showForm ? resetForm() : setShowForm(true))} className="px-3.5 py-2 rounded-lg text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>+ مريض جديد</button>
      </div>
      {showForm && (
        <div className="rounded-lg p-4 space-y-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <Field label="الاسم الكامل"><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
            <Field label="العمر"><input type="number" value={form.age} onChange={(e) => setForm({ ...form, age: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
            <Field label="الجنس"><select value={form.gender} onChange={(e) => setForm({ ...form, gender: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}><option>ذكر</option><option>أنثى</option></select></Field>
            <Field label="رقم الهاتف"><input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
          </div>
          <ErrorNote>{error}</ErrorNote>
          <div className="flex gap-2">
            <button onClick={submit} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>{editingId ? 'حفظ التعديلات' : 'حفظ المريض'}</button>
            <button onClick={resetForm} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
          </div>
        </div>
      )}

function PatientHistoryView({ patient, orders, catalog, setView }) {
  if (!patient) return <div className="p-6"><EmptyState text="لم يتم تحديد مريض" /></div>;
  const completed = orders.filter((o) => o.patient_id === patient.id && o.status === 'completed').sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  const byTest = {};
  completed.forEach((o) => {
    Object.entries(o.results || {}).forEach(([testId, value]) => {
      if (!byTest[testId]) byTest[testId] = [];
      byTest[testId].push({ date: o.created_at, value, sampleId: o.sample_id });
    });
  });
  const testIds = Object.keys(byTest);

  return (
    <div className="p-6 space-y-5">
      <button onClick={() => setView('patients')} className="text-sm font-bold" style={{ color: C.accent }}>‹ رجوع للمرضى</button>
      <div>
        <div className="text-2xl font-bold" style={{ color: C.ink }}>السجل التاريخي — {patient.name}</div>
        <div className="text-sm" style={{ color: C.inkMuted }}>{completed.length} طلب مكتمل</div>
      </div>
      {testIds.length === 0 ? (
        <EmptyState text="لا يوجد سجل نتائج سابق لهذا المريض" />
      ) : (
        <div className="space-y-4">
          {testIds.map((testId) => {
            const test = catalog.find((c) => c.id === testId);
            if (!test) return null;
            const points = byTest[testId];
            const r = resolveTestRanges(test, patient);
            return (
              <div key={testId} className="rounded-lg p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
                <div className="font-bold text-sm mb-3" style={{ color: C.ink }}>
                  {test.name} <span className="font-normal text-xs" style={{ color: C.inkMuted }}>({r.min}–{r.max} {test.unit})</span>
                </div>
                <div className="space-y-2">
                  {points.map((pt, idx) => {
                    const prev = idx > 0 ? points[idx - 1].value : null;
                    const trend = prev === null ? null : pt.value > prev ? 'up' : pt.value < prev ? 'down' : 'flat';
                    return (
                      <div key={idx} className="flex items-center justify-between gap-3 text-sm">
                        <div className="font-mono text-xs w-28 shrink-0" style={{ color: C.inkMuted }}>{fmtDate(pt.date)}</div>
                        <div className="flex-1"><RangeGauge value={pt.value} min={r.min} max={r.max} critLow={r.critLow} critHigh={r.critHigh} /></div>
                        <div className="font-mono font-bold shrink-0" style={{ color: C.ink }}>{pt.value} {test.unit}</div>
                        <div className="w-5 text-center shrink-0">
                          {trend === 'up' && <span style={{ color: C.warning }}>▲</span>}
                          {trend === 'down' && <span style={{ color: C.accent }}>▼</span>}
                          {trend === 'flat' && <span style={{ color: C.inkFaint }}>→</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function OrdersView({ patients, catalog, orders, inventory, actions, setView, setActiveOrderId, filterPatientId, clearFilter, askConfirm, isManager }) {
  const [tab, setTab] = useState('list');
  const [selectedPatient, setSelectedPatient] = useState('');
  const [selectedTests, setSelectedTests] = useState([]);
  const [referringDoctor, setReferringDoctor] = useState('');
  const [query, setQuery] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [busy, setBusy] = useState(false);
  const [rejectingOrder, setRejectingOrder] = useState(null);

  const knownDoctors = [...new Set(orders.map((o) => o.referring_doctor).filter(Boolean))];

  const total = catalog.filter((c) => selectedTests.includes(c.id)).reduce((s, c) => s + Number(c.price), 0);
  const canSubmit = Boolean(selectedPatient) && selectedTests.length > 0 && !busy;
  const toggleTest = (id) => setSelectedTests((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));

  const lowStockWarnings = catalog.filter((c) => selectedTests.includes(c.id) && c.consumes_item_id)
    .map((c) => inventory.find((i) => i.id === c.consumes_item_id)).filter((item) => item && item.quantity <= item.threshold);

  const submit = async () => {
    if (!canSubmit) return;
    setBusy(true);
    await actions.addOrder(selectedPatient, selectedTests, referringDoctor.trim() || null);
    setBusy(false);
    setSelectedPatient(''); setSelectedTests([]); setReferringDoctor(''); setTab('list');
  };

  let visible = filterPatientId ? orders.filter((o) => o.patient_id === filterPatientId) : orders;
  if (statusFilter !== 'all') visible = visible.filter((o) => o.status === statusFilter);
  if (query.trim()) {
    const q = query.trim();
    visible = visible.filter((o) => {
      const patient = patients.find((p) => p.id === o.patient_id);

  return (
    <div className="p-6 space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">

          <button onClick={() => setTab('new')} className="px-4 py-2 text-sm font-bold" style={{ background: tab === 'new' ? C.accent : C.surface, color: tab === 'new' ? '#fff' : C.inkMuted }}>طلب جديد</button>
        </div>
      </div>

      {tab === 'new' ? (
        <div className="rounded-lg p-5 space-y-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <Field label="المريض">
            <select value={selectedPatient} onChange={(e) => setSelectedPatient(e.target.value)} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
              <option value="">اختر مريضاً...</option>
              {patients.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="الطبيب المحوّل (اختياري)">
            <input list="referring-doctors-list" value={referringDoctor} onChange={(e) => setReferringDoctor(e.target.value)} placeholder="اسم الطبيب..." className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} />

            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
              {catalog.map((c) => {
                const checked = selectedTests.includes(c.id);
                return (
                  <label key={c.id} className="flex items-center justify-between gap-2 px-3 py-2 rounded-md cursor-pointer text-sm" style={{ background: checked ? C.accentSoft : C.bg, border: `1px solid ${checked ? C.accent : C.line}` }}>

            <button onClick={submit} className="px-4 py-2.5 rounded-lg text-sm font-bold" style={{ background: C.accent, color: '#fff', opacity: canSubmit ? 1 : 0.4 }}>{busy ? '...جارِ الحفظ' : 'تسجيل الطلب'}</button>

          <div className="flex flex-wrap gap-3">
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="بحث باسم المريض أو رقم العينة..." className="flex-1 min-w-[200px] px-3 py-2.5 rounded-lg text-sm" style={{ ...inputStyle, background: C.surface }} />
            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="px-3 py-2.5 rounded-lg text-sm" style={{ ...inputStyle, background: C.surface }}>
              <option value="all">كل الحالات</option><option value="pending">قيد الانتظار</option><option value="pending_review">بانتظار الاعتماد</option><option value="completed">مكتمل</option><option value="cancelled">ملغى</option>

          </div>
          <div className="rounded-lg overflow-x-auto" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <table className="w-full text-sm">
              <thead><tr style={{ borderBottom: `1px solid ${C.line}` }}>
                <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>رقم العينة</th>
                <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>المريض</th>
                <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>التاريخ</th>
                <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الحالة</th>
                <th></th>
              </tr></thead>
              <tbody>
                {pageItems.map((o) => {
                  const patient = patients.find((p) => p.id === o.patient_id);
                  return (
                    <tr key={o.id} style={{ borderBottom: `1px solid ${C.line}` }}>

// ---------------------------------------------------------------------------
// Results entry
// ---------------------------------------------------------------------------
function ResultsEntryView({ order, patient, catalog, actions, setView }) {
  const [values, setValues] = useState(() => order ? Object.fromEntries(order.test_ids.map((id) => [id, ''])) : {});
  const [busy, setBusy] = useState(false);
  if (!order) return <div className="p-6"><EmptyState text="لم يتم تحديد طلب" /></div>;

  const tests = order.test_ids.map((id) => catalog.find((c) => c.id === id)).filter(Boolean);
  const allFilled = tests.every((t) => values[t.id] !== '' && !isNaN(Number(values[t.id])) && Number(values[t.id]) >= 0);
  const anyCritical = tests.some((t) => {
    const v = values[t.id];
    if (v === '' || isNaN(Number(v))) return false;
    return classifyValue(Number(v), resolveTestRanges(t, patient)) === 'critical';
  });

  const save = async () => {
    if (!allFilled) return;
    setBusy(true);
    const numeric = Object.fromEntries(Object.entries(values).map(([k, v]) => [k, Number(v)]));
    await actions.submitResults(order.id, numeric, anyCritical, order.sample_id);
    setBusy(false);
    setView('orders');
  };

  return (
    <div className="p-6 space-y-5">
      <button onClick={() => setView('orders')} className="text-sm font-bold" style={{ color: C.accent }}>‹ رجوع للطلبات</button>
      <div>
        <div className="text-2xl font-bold" style={{ color: C.ink }}>إدخال النتائج</div>
        <div className="text-sm font-mono" style={{ color: C.inkMuted }}>{patient?.name} · {order.sample_id}</div>
      </div>
      {order.rejection_note && <div className="px-4 py-3 rounded-lg text-sm" style={{ background: C.warningSoft, color: C.warning }}><span className="font-bold">أُرجع هذا الطلب من المدير لإعادة الإدخال: </span>{order.rejection_note}</div>}
      {anyCritical && <div className="px-4 py-3 rounded-lg text-sm font-bold" style={{ background: C.criticalDeepSoft, color: C.criticalDeep }}>⚠ توجد قيمة حرجة ضمن هذه النتائج — يُرجى التأكد منها قبل الحفظ</div>}
      <div className="rounded-lg" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        {tests.map((t, idx) => {
          const v = values[t.id]; const num = Number(v); const showGauge = v !== '' && !isNaN(num);
          const r = resolveTestRanges(t, patient);
          return (
            <div key={t.id} className="p-4 grid grid-cols-2 md:grid-cols-4 gap-3 items-center" style={{ borderBottom: idx < tests.length - 1 ? `1px solid ${C.line}` : 'none' }}>
              <div className="col-span-2 md:col-span-1"><div className="font-bold text-sm" style={{ color: C.ink }}>{t.name}</div><div className="text-xs font-mono" style={{ color: C.inkMuted }}>المعدل: {r.min}–{r.max} {t.unit}</div></div>
              <input type="number" step="any" min="0" value={v} onChange={(e) => setValues({ ...values, [t.id]: e.target.value })} placeholder="القيمة" className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} />
              <div>{showGauge && <RangeGauge value={num} min={r.min} max={r.max} critLow={r.critLow} critHigh={r.critHigh} />}</div>
              <div>{showGauge && <Flag value={num} min={r.min} max={r.max} critLow={r.critLow} critHigh={r.critHigh} />}</div>
            </div>
          );
        })}
      </div>
      <button onClick={save} disabled={!allFilled || busy} className="px-5 py-2.5 rounded-lg text-sm font-bold" style={{ background: C.accent, color: '#fff', opacity: allFilled && !busy ? 1 : 0.4 }}>{busy ? '...جارِ الحفظ' : 'إرسال النتائج للمراجعة'}</button>
    </div>
  );
}

          <div><span style={{ color: C.inkMuted }}>العمر: </span><span className="font-bold font-mono" style={{ color: C.ink }}>{patient?.age}</span></div>
          <div><span style={{ color: C.inkMuted }}>الجنس: </span><span className="font-bold" style={{ color: C.ink }}>{patient?.gender}</span></div>
          {order.referring_doctor && <div><span style={{ color: C.inkMuted }}>الطبيب المحوّل: </span><span className="font-bold" style={{ color: C.ink }}>د. {order.referring_doctor}</span></div>}
        </div>
        <table className="w-full text-sm min-w-[560px]">
          <thead><tr style={{ borderBottom: `1px solid ${C.ink}` }}>
            <th className="text-right py-2 font-bold" style={{ color: C.ink }}>الفحص</th>
            <th className="text-right py-2 font-bold" style={{ color: C.ink }}>النتيجة</th>
            <th className="text-right py-2 font-bold" style={{ color: C.ink }}>المعدل الطبيعي</th>
            <th className="text-right py-2 font-bold" style={{ color: C.ink }}>المؤشر</th>
            <th className="text-right py-2 font-bold" style={{ color: C.ink }}>الحالة</th>
          </tr></thead>
          <tbody>
            {tests.map((t) => {
              const value = order.results[t.id];
              const r = resolveTestRanges(t, patient);
              const status = classifyValue(value, r);
              const rowBg = status === 'critical' ? C.criticalDeepSoft : status === 'abnormal' ? C.criticalSoft : 'transparent';
              return (
                <tr key={t.id} style={{ borderBottom: `1px solid ${C.line}`, background: rowBg }}>
                  <td className="py-2.5" style={{ color: C.ink }}>{t.name}</td>
                  <td className="py-2.5 font-mono font-bold" style={{ color: status !== 'normal' ? C.critical : C.ink }}>{value} {t.unit}</td>
                  <td className="py-2.5 font-mono text-xs" style={{ color: C.inkMuted }}>{r.min}–{r.max} {t.unit}</td>
                  <td className="py-2.5 w-28"><RangeGauge value={value} min={r.min} max={r.max} critLow={r.critLow} critHigh={r.critHigh} /></td>
                  <td className="py-2.5"><Flag value={value} min={r.min} max={r.max} critLow={r.critLow} critHigh={r.critHigh} /></td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div className="mt-8 pt-4 text-xs text-center" style={{ borderTop: `1px solid ${C.line}`, color: C.inkFaint }}>{labSettings?.report_footer || 'هذا التقرير صادر إلكترونياً من نظام إدارة المختبر ولا يغني عن استشارة الطبيب المعالج'}</div>
      </div>
    </div>
  );
}

function InventoryView({ inventory, catalog, actions, askConfirm }) {
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ name: '', unit: '', quantity: '', threshold: '', expiry: '' });
  const [error, setError] = useState('');
  const { page, setPage, totalPages, pageItems } = usePagination(inventory, 6);

  const resetForm = () => { setForm({ name: '', unit: '', quantity: '', threshold: '', expiry: '' }); setEditingId(null); setShowForm(false); setError(''); };
  const startEdit = (item) => { setEditingId(item.id); setForm({ name: item.name, unit: item.unit, quantity: String(item.quantity), threshold: String(item.threshold), expiry: item.expiry_date || '' }); setShowForm(true); setError(''); };

  const submit = async () => {
    if (!form.name.trim()) { setError('اسم الصنف مطلوب'); return; }
    const quantity = Number(form.quantity), threshold = Number(form.threshold);
    if (isNaN(quantity) || quantity < 0) { setError('الكمية يجب أن تكون رقماً موجباً'); return; }
    if (isNaN(threshold) || threshold < 0) { setError('حد التنبيه يجب أن يكون رقماً موجباً'); return; }
    const payload = { name: form.name.trim(), unit: form.unit.trim() || 'قطعة', quantity, threshold, expiry_date: form.expiry || null };
    if (editingId) await actions.updateInventory(editingId, payload); else await actions.addInventory(payload);
    resetForm();
  };

  const onDelete = (item) => {
    const used = catalog.some((c) => c.consumes_item_id === item.id);
    if (used) { setError(`لا يمكن حذف "${item.name}" — مرتبط بفحص في الإعدادات`); return; }
    askConfirm({ title: 'حذف صنف', message: `هل تريد حذف "${item.name}"؟`, danger: true, onConfirm: () => actions.deleteInventory(item.id, item.name) });
  };

  return (
    <div className="p-6 space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="text-2xl font-bold" style={{ color: C.ink }}>المخزون</div>
        <button onClick={() => (showForm ? resetForm() : setShowForm(true))} className="px-3.5 py-2 rounded-lg text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>+ صنف جديد</button>
      </div>
      {showForm && (
        <div className="rounded-lg p-4 space-y-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
            <Field label="اسم الصنف"><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
            <Field label="الوحدة"><input value={form.unit} onChange={(e) => setForm({ ...form, unit: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
            <Field label="الكمية"><input type="number" min="0" value={form.quantity} onChange={(e) => setForm({ ...form, quantity: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
            <Field label="حد التنبيه"><input type="number" min="0" value={form.threshold} onChange={(e) => setForm({ ...form, threshold: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
            <Field label="تاريخ الصلاحية (اختياري)"><input type="date" value={form.expiry} onChange={(e) => setForm({ ...form, expiry: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
          </div>
          <ErrorNote>{error}</ErrorNote>
          <div className="flex gap-2">
            <button onClick={submit} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>{editingId ? 'حفظ التعديلات' : 'حفظ'}</button>
            <button onClick={resetForm} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
          </div>
        </div>
      )}
      {!showForm && <ErrorNote>{error}</ErrorNote>}
      <div className="rounded-lg overflow-x-auto" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <table className="w-full text-sm">
          <thead><tr style={{ borderBottom: `1px solid ${C.line}` }}>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الصنف</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الكمية</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الحالة</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الصلاحية</th>
            <th></th>
          </tr></thead>
          <tbody>
            {pageItems.map((item) => {
              const low = item.quantity <= item.threshold;
              const exp = expiryStatus(item.expiry_date);
              return (
                <tr key={item.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                  <td className="px-4 py-3 font-bold whitespace-nowrap" style={{ color: C.ink }}>{item.name}</td>
                  <td className="px-4 py-3 whitespace-nowrap">
                    <input type="number" min="0" value={item.quantity} onChange={(e) => actions.setQuantity(item.id, item.name, Math.max(0, Number(e.target.value)))} className="w-20 px-2 py-1 rounded-md text-sm font-mono" style={inputStyle} />
                    <span className="text-xs" style={{ color: C.inkMuted }}> {item.unit}</span>
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap">{low ? <Badge tone="critical">منخفض</Badge> : <Badge tone="normal">متوفر</Badge>}</td>
                  <td className="px-4 py-3 whitespace-nowrap">
                    {!exp && <span className="text-xs" style={{ color: C.inkFaint }}>—</span>}
                    {exp && exp.level === 'expired' && <Badge tone="critical">منتهي منذ {Math.abs(exp.days)} يوم</Badge>}
                    {exp && exp.level === 'soon' && <Badge tone="warning">ينتهي خلال {exp.days} يوم</Badge>}
                    {exp && exp.level === 'ok' && <span className="text-xs font-mono" style={{ color: C.inkMuted }}>{fmtDate(item.expiry_date)}</span>}
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap">
                    <div className="flex items-center gap-3">
                      <button onClick={() => startEdit(item)} className="text-xs font-bold" style={{ color: C.accent }}>تعديل</button>
                      <button onClick={() => onDelete(item)} className="text-xs font-bold" style={{ color: C.critical }}>حذف</button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <PaginationBar page={page} totalPages={totalPages} setPage={setPage} />
      </div>
    </div>
  );
}

function purchasePaid(p) { return (p.purchase_payments || []).reduce((s, x) => s + Number(x.amount), 0); }

function SuppliersView({ suppliers, purchases, inventory, accounts, actions, askConfirm, isManager }) {

  return (
    <div className="p-6 space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="text-2xl font-bold" style={{ color: C.ink }}>الموردين والمشتريات</div>
        <div className="flex rounded-lg overflow-hidden" style={{ border: `1px solid ${C.line}` }}>
          <button onClick={() => setTab('suppliers')} className="px-4 py-2 text-sm font-bold" style={{ background: tab === 'suppliers' ? C.accent : C.surface, color: tab === 'suppliers' ? '#fff' : C.inkMuted }}>الموردين</button>
          <button onClick={() => setTab('purchases')} className="px-4 py-2 text-sm font-bold" style={{ background: tab === 'purchases' ? C.accent : C.surface, color: tab === 'purchases' ? '#fff' : C.inkMuted }}>المشتريات</button>

  );
}

function SuppliersTab({ suppliers, purchases, actions, askConfirm, isManager }) {
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ name: '', phone: '', notes: '' });
  const [error, setError] = useState('');
  const { page, setPage, totalPages, pageItems } = usePagination(suppliers, 6);

  const resetForm = () => { setForm({ name: '', phone: '', notes: '' }); setEditingId(null); setShowForm(false); setError(''); };
  const startEdit = (s) => { setEditingId(s.id); setForm({ name: s.name, phone: s.phone || '', notes: s.notes || '' }); setShowForm(true); setError(''); };

  const submit = async () => {
    if (!form.name.trim()) { setError('اسم المورد مطلوب'); return; }
    const payload = { name: form.name.trim(), phone: form.phone.trim(), notes: form.notes.trim() };
    if (editingId) await actions.updateSupplier(editingId, payload); else await actions.addSupplier(payload);
    resetForm();
  };

  const balanceFor = (supplierId) => purchases
    .filter((p) => p.supplier_id === supplierId)
    .reduce((s, p) => s + Math.max(0, p.total_amount - purchasePaid(p)), 0);

  const onDelete = (s) => {
    const used = purchases.some((p) => p.supplier_id === s.id);

    <div className="space-y-4">

      </div>}
      {showForm && isManager && (
        <div className="rounded-lg p-4 space-y-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            <Field label="اسم المورد"><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
            <Field label="رقم الهاتف"><input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
            <Field label="ملاحظات"><input value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
          </div>
          <ErrorNote>{error}</ErrorNote>
          <div className="flex gap-2">
            <button onClick={submit} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>{editingId ? 'حفظ التعديلات' : 'حفظ المورد'}</button>
            <button onClick={resetForm} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
          </div>
        </div>
      )}
      {!showForm && <ErrorNote>{error}</ErrorNote>}
      <div className="rounded-lg overflow-x-auto" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <table className="w-full text-sm">
          <thead><tr style={{ borderBottom: `1px solid ${C.line}` }}>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>المورد</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الهاتف</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>رصيد مستحق</th>
            <th></th>
          </tr></thead>
          <tbody>
            {pageItems.map((s) => {
              const bal = balanceFor(s.id);
              return (
                <tr key={s.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                  <td className="px-4 py-3 font-bold whitespace-nowrap" style={{ color: C.ink }}>{s.name}</td>
                  <td className="px-4 py-3 font-mono whitespace-nowrap" style={{ color: C.inkMuted }}>{s.phone}</td>
                  <td className="px-4 py-3 font-mono font-bold whitespace-nowrap" style={{ color: bal ? C.critical : C.inkMuted }}>{SAR(bal)}</td>
                  <td className="px-4 py-3 whitespace-nowrap">
                    {isManager && <div className="flex items-center gap-3">
                      <button onClick={() => startEdit(s)} className="text-xs font-bold" style={{ color: C.accent }}>تعديل</button>
                      <button onClick={() => onDelete(s)} className="text-xs font-bold" style={{ color: C.critical }}>حذف</button>
                    </div>}
                  </td>
                </tr>
              );
            })}
            {pageItems.length === 0 && <tr><td colSpan={4}><EmptyState text="لا يوجد موردون مسجلون" /></td></tr>}
          </tbody>
        </table>
        <PaginationBar page={page} totalPages={totalPages} setPage={setPage} />
      </div>
    </div>
  );
}

function PurchasesTab({ suppliers, purchases, inventory, accounts, actions }) {
  const [showForm, setShowForm] = useState(false);
  const [supplierId, setSupplierId] = useState('');
  const [paymentType, setPaymentType] = useState('نقدي');
  const [invoiceNo, setInvoiceNo] = useState('');
  const [accountId, setAccountId] = useState(accounts[0]?.id || '');
  const [lines, setLines] = useState({}); // itemId -> { checked, qty, cost }
  const [error, setError] = useState('');
  const [expandedId, setExpandedId] = useState(null);
  const [payForm, setPayForm] = useState({ amount: '', method: 'نقدي', accountId: accounts[0]?.id || '' });
  const { page, setPage, totalPages, pageItems } = usePagination(purchases, 6);

  const toggleLine = (id) => setLines((l) => ({ ...l, [id]: { ...(l[id] || { qty: '1', cost: '' }), checked: !l[id]?.checked } }));
  const updateLine = (id, field, value) => setLines((l) => ({ ...l, [id]: { ...(l[id] || {}), [field]: value } }));

  const selectedLines = Object.entries(lines).filter(([, v]) => v.checked);
  const total = selectedLines.reduce((s, [, v]) => s + (Number(v.qty) || 0) * (Number(v.cost) || 0), 0);

  const resetForm = () => { setSupplierId(''); setPaymentType('نقدي'); setInvoiceNo(''); setAccountId(accounts[0]?.id || ''); setLines({}); setShowForm(false); setError(''); };

  const submit = async () => {
    if (!supplierId) { setError('اختر مورداً'); return; }
    if (selectedLines.length === 0) { setError('اختر صنفاً واحداً على الأقل'); return; }
    for (const [, v] of selectedLines) {
      if (!v.qty || Number(v.qty) <= 0 || !v.cost || Number(v.cost) < 0) { setError('تأكد من إدخال كمية وسعر صحيحين لكل صنف محدد'); return; }
    }
    if (paymentType === 'نقدي' && !accountId) { setError('اختر الصندوق أو الحساب الذي سيُدفع منه'); return; }
    const items = selectedLines.map(([id, v]) => {
      const item = inventory.find((i) => i.id === id);
      return { item_id: id, item_name: item?.name || '', quantity: Number(v.qty), unit_cost: Number(v.cost) };
    });
    await actions.addPurchase(supplierId, items, paymentType, invoiceNo.trim(), paymentType === 'نقدي' ? accountId : null);
    resetForm();
  };

  const openPay = (p) => { setExpandedId(p.id === expandedId ? null : p.id); setPayForm({ amount: '', method: 'نقدي', accountId: accounts[0]?.id || '' }); setError(''); };
  const submitPayment = async (p) => {
    const amount = Number(payForm.amount);
    const remaining = p.total_amount - purchasePaid(p);
    if (isNaN(amount) || amount <= 0) { setError('أدخل مبلغاً صحيحاً أكبر من صفر'); return; }
    if (amount > remaining) { setError(`المبلغ أكبر من المتبقي (${SAR(remaining)})`); return; }
    if (!payForm.accountId) { setError('اختر الصندوق أو الحساب الذي سيُدفع منه'); return; }
    await actions.addPurchasePayment(p.id, amount, payForm.method, payForm.accountId);
    setExpandedId(null); setError('');
  };

  return (
    <div className="space-y-4">
      <div className="flex justify-end">
        <button onClick={() => (showForm ? resetForm() : setShowForm(true))} className="px-3.5 py-2 rounded-lg text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>+ فاتورة شراء جديدة</button>
      </div>

      {showForm && (
        <div className="rounded-lg p-4 space-y-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <Field label="المورد">
              <select value={supplierId} onChange={(e) => setSupplierId(e.target.value)} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
                <option value="">اختر مورداً...</option>
                {suppliers.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </Field>
            <Field label="نوع الدفع">
              <select value={paymentType} onChange={(e) => setPaymentType(e.target.value)} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
                <option value="نقدي">نقدي</option>
                <option value="آجل">آجل</option>
              </select>
            </Field>
            <Field label="رقم فاتورة المورد (اختياري)"><input value={invoiceNo} onChange={(e) => setInvoiceNo(e.target.value)} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
            {paymentType === 'نقدي' && (
              <Field label="الصندوق/الحساب الدافع">
                <select value={accountId} onChange={(e) => setAccountId(e.target.value)} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
                  {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </Field>
            )}
          </div>

          <div>
            <div className="text-xs font-bold mb-2" style={{ color: C.inkMuted }}>الأصناف المشتراة</div>
            <div className="space-y-2">
              {inventory.map((item) => {
                const line = lines[item.id] || {};
                return (
                  <div key={item.id} className="rounded-md p-3" style={{ background: line.checked ? C.accentSoft : C.bg, border: `1px solid ${line.checked ? C.accent : C.line}` }}>
                    <label className="flex items-center gap-2 text-sm mb-2">
                      <input type="checkbox" checked={Boolean(line.checked)} onChange={() => toggleLine(item.id)} />
                      <span style={{ color: C.ink }}>{item.name}</span>
                      <span className="text-xs" style={{ color: C.inkMuted }}>({item.unit})</span>
                    </label>
                    {line.checked && (
                      <div className="grid grid-cols-2 gap-2 pr-6">
                        <input type="number" min="0" placeholder="الكمية" value={line.qty || ''} onChange={(e) => updateLine(item.id, 'qty', e.target.value)} className="px-3 py-1.5 rounded-md text-sm font-mono" style={{ ...inputStyle, background: C.surface }} />
                        <input type="number" min="0" placeholder="سعر الوحدة" value={line.cost || ''} onChange={(e) => updateLine(item.id, 'cost', e.target.value)} className="px-3 py-1.5 rounded-md text-sm font-mono" style={{ ...inputStyle, background: C.surface }} />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          <ErrorNote>{error}</ErrorNote>
          <div className="flex items-center justify-between flex-wrap gap-3 pt-3" style={{ borderTop: `1px solid ${C.line}` }}>
            <div className="text-sm" style={{ color: C.inkMuted }}>الإجمالي: <span className="font-mono font-bold text-base" style={{ color: C.ink }}>{SAR(total)}</span></div>
            <button onClick={submit} className="px-4 py-2.5 rounded-lg text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>حفظ فاتورة الشراء</button>
          </div>
        </div>
      )}

            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>المتبقي</th>

                          <Field label="طريقة الدفع"><select value={payForm.method} onChange={(e) => setPayForm({ ...payForm, method: e.target.value })} className="px-3 py-2 rounded-md text-sm" style={{ ...inputStyle, background: C.surface }}><option>نقدي</option><option>بطاقة</option><option>تحويل بنكي</option></select></Field>

                          <button onClick={() => setExpandedId(null)} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
                        </div>
                        <ErrorNote>{error}</ErrorNote>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
            {pageItems.length === 0 && <tr><td colSpan={6}><EmptyState text="لا توجد فواتير شراء" /></td></tr>}
          </tbody>
        </table>
        <PaginationBar page={page} totalPages={totalPages} setPage={setPage} />
      </div>
    </div>
  );
}

function accountBalance(account, transactions) {
  const txs = transactions.filter((t) => t.account_id === account.id);
  const inSum = txs.filter((t) => t.direction === 'in').reduce((s, t) => s + Number(t.amount), 0);
  const outSum = txs.filter((t) => t.direction === 'out').reduce((s, t) => s + Number(t.amount), 0);
  return Number(account.opening_balance) + inSum - outSum;
}

function AccountsTab({ accounts, transactions, actions, askConfirm, isManager }) {
  const [showAccountForm, setShowAccountForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [accForm, setAccForm] = useState({ name: '', type: 'نقدي', bankName: '', accountNumber: '', openingBalance: '' });
  const [error, setError] = useState('');
  const [expandedAccountId, setExpandedAccountId] = useState(null);
  const [txForm, setTxForm] = useState({ direction: 'in', amount: '', category: '', description: '' });

  const cashTotal = accounts.filter((a) => a.type === 'نقدي').reduce((s, a) => s + accountBalance(a, transactions), 0);
  const bankTotal = accounts.filter((a) => a.type === 'بنكي').reduce((s, a) => s + accountBalance(a, transactions), 0);

  const now = new Date();
  const monthTx = transactions.filter((t) => { const d = new Date(t.created_at); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  const monthIn = monthTx.filter((t) => t.direction === 'in').reduce((s, t) => s + Number(t.amount), 0);
  const monthOut = monthTx.filter((t) => t.direction === 'out').reduce((s, t) => s + Number(t.amount), 0);

  const resetAccForm = () => { setAccForm({ name: '', type: 'نقدي', bankName: '', accountNumber: '', openingBalance: '' }); setEditingId(null); setShowAccountForm(false); setError(''); };
  const startEdit = (a) => { setEditingId(a.id); setAccForm({ name: a.name, type: a.type, bankName: a.bank_name || '', accountNumber: a.account_number || '', openingBalance: String(a.opening_balance) }); setShowAccountForm(true); setError(''); };

  const submitAccount = async () => {
    if (!accForm.name.trim()) { setError('اسم الحساب مطلوب'); return; }
    const opening = Number(accForm.openingBalance) || 0;
    const payload = { name: accForm.name.trim(), type: accForm.type, bank_name: accForm.bankName.trim() || null, account_number: accForm.accountNumber.trim() || null, opening_balance: opening };
    if (editingId) await actions.updateAccount(editingId, payload); else await actions.addAccount(payload);
    resetAccForm();
  };

  const onDeleteAccount = (a) => {
    const used = transactions.some((t) => t.account_id === a.id);
    if (used) { setError(`لا يمكن حذف "${a.name}" — له حركات مالية مسجلة`); return; }
    askConfirm({ title: 'حذف حساب', message: `هل تريد حذف "${a.name}"؟`, danger: true, onConfirm: () => actions.deleteAccount(a.id, a.name) });
  };

  const openTx = (a) => { setExpandedAccountId(a.id === expandedAccountId ? null : a.id); setTxForm({ direction: 'in', amount: '', category: '', description: '' }); setError(''); };
  const submitTx = async (a) => {
    const amount = Number(txForm.amount);
    if (isNaN(amount) || amount <= 0) { setError('أدخل مبلغاً صحيحاً أكبر من صفر'); return; }
    if (!txForm.category.trim()) { setError('أدخل تصنيف الحركة (مثلاً: إيجار، رواتب، إيداع رأس مال)'); return; }
    await actions.addManualTransaction(a.id, txForm.direction, amount, txForm.category.trim(), txForm.description.trim());
    setExpandedAccountId(null); setError('');
  };

  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard label="إجمالي الصناديق النقدية" value={SAR(cashTotal)} />
        <StatCard label="إجمالي الحسابات البنكية" value={SAR(bankTotal)} />
        <StatCard label="إيرادات هذا الشهر" value={SAR(monthIn)} />
        <StatCard label="مصروفات هذا الشهر" value={SAR(monthOut)} tone={monthOut ? 'warning' : undefined} />
      </div>

      {isManager && <div className="flex justify-end">
        <button onClick={() => (showAccountForm ? resetAccForm() : setShowAccountForm(true))} className="px-3.5 py-2 rounded-lg text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>+ حساب جديد</button>
      </div>}

      {showAccountForm && (
        <div className="rounded-lg p-4 space-y-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <Field label="اسم الحساب"><input value={accForm.name} onChange={(e) => setAccForm({ ...accForm, name: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
            <Field label="النوع">
              <select value={accForm.type} onChange={(e) => setAccForm({ ...accForm, type: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
                <option value="نقدي">صندوق نقدي</option>
                <option value="بنكي">حساب بنكي</option>
              </select>
            </Field>
            {accForm.type === 'بنكي' && <Field label="اسم البنك"><input value={accForm.bankName} onChange={(e) => setAccForm({ ...accForm, bankName: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>}
            {accForm.type === 'بنكي' && <Field label="رقم الحساب"><input value={accForm.accountNumber} onChange={(e) => setAccForm({ ...accForm, accountNumber: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>}
            <Field label="الرصيد الافتتاحي"><input type="number" value={accForm.openingBalance} onChange={(e) => setAccForm({ ...accForm, openingBalance: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
          </div>
          <ErrorNote>{error}</ErrorNote>
          <div className="flex gap-2">
            <button onClick={submitAccount} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>{editingId ? 'حفظ التعديلات' : 'حفظ الحساب'}</button>
            <button onClick={resetAccForm} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
          </div>
        </div>
      )}
      {!showAccountForm && <ErrorNote>{error}</ErrorNote>}

      <div className="space-y-3">
        {accounts.map((a) => {
          const bal = accountBalance(a, transactions);
          const accTx = transactions.filter((t) => t.account_id === a.id).slice().reverse().slice(0, 5);
          return (
            <div key={a.id} className="rounded-lg p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
              <div className="flex items-center justify-between flex-wrap gap-2">
                <div>
                  <div className="font-bold text-sm flex items-center gap-2" style={{ color: C.ink }}>
                    {a.name} <Badge tone="accent">{a.type}</Badge>
                  </div>
                  {a.type === 'بنكي' && <div className="text-xs font-mono" style={{ color: C.inkMuted }}>{a.bank_name} · {a.account_number}</div>}
                </div>
                <div className="flex items-center gap-3">
                  <div className="font-mono font-bold text-base" style={{ color: C.ink }}>{SAR(bal)}</div>
                  <button onClick={() => openTx(a)} className="text-xs font-bold" style={{ color: C.accent }}>قيد يدوي</button>
                  {isManager && <button onClick={() => startEdit(a)} className="text-xs font-bold" style={{ color: C.accent }}>تعديل</button>}
                  {isManager && <button onClick={() => onDeleteAccount(a)} className="text-xs font-bold" style={{ color: C.critical }}>حذف</button>}
                </div>
              </div>

              {expandedAccountId === a.id && (
                <div className="mt-3 pt-3 space-y-3" style={{ borderTop: `1px solid ${C.line}` }}>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-2 items-end">
                    <Field label="النوع">
                      <select value={txForm.direction} onChange={(e) => setTxForm({ ...txForm, direction: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
                        <option value="in">إيداع (دخل)</option>
                        <option value="out">مصروف (خرج)</option>
                      </select>
                    </Field>
                    <Field label="المبلغ"><input type="number" min="0" value={txForm.amount} onChange={(e) => setTxForm({ ...txForm, amount: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
                    <Field label="التصنيف">
                      <input list="tx-categories-list" value={txForm.category} onChange={(e) => setTxForm({ ...txForm, category: e.target.value })} placeholder="إيجار، رواتب..." className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} />
                      <datalist id="tx-categories-list">{COMMON_TX_CATEGORIES.map((c) => <option key={c} value={c} />)}</datalist>
                    </Field>
                    <Field label="ملاحظات (اختياري)"><input value={txForm.description} onChange={(e) => setTxForm({ ...txForm, description: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => submitTx(a)} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>حفظ القيد</button>
                    <button onClick={() => setExpandedAccountId(null)} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
                  </div>
                  {accTx.length > 0 && (
                    <div className="text-xs space-y-1 pt-2" style={{ color: C.inkMuted, borderTop: `1px solid ${C.line}` }}>
                      <div className="font-bold" style={{ color: C.ink }}>آخر الحركات</div>
                      {accTx.map((t) => (
                        <div key={t.id} className="flex items-center justify-between">
                          <span>{fmtDate(t.created_at)} · {t.category}{t.description ? ' — ' + t.description : ''}</span>
                          <span className="font-mono font-bold" style={{ color: t.direction === 'in' ? C.normal : C.critical }}>{t.direction === 'in' ? '+' : '-'}{SAR(t.amount)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
        {accounts.length === 0 && <EmptyState text="لا توجد صناديق أو حسابات مسجلة بعد" />}
      </div>
    </div>
  );
}

function PayrollTab({ staff, accounts, salaryPayments, actions }) {
  const [editingSalaryId, setEditingSalaryId] = useState(null);
  const [salaryDraft, setSalaryDraft] = useState('');
  const [payingId, setPayingId] = useState(null);
  const [payForm, setPayForm] = useState({ amount: '', accountId: '', period: '' });
  const [error, setError] = useState('');

  const startEditSalary = (p) => { setEditingSalaryId(p.id); setSalaryDraft(p.base_salary != null ? String(p.base_salary) : ''); };
  const saveSalary = (p) => {
    const val = salaryDraft === '' ? null : Number(salaryDraft);
    if (val !== null && (isNaN(val) || val < 0)) { setError('الراتب يجب أن يكون رقماً موجباً'); return; }
    actions.updateStaffSalary(p.id, p.display_name, val);
    setEditingSalaryId(null); setError('');
  };

  const openPay = (p) => { setPayingId(p.id); setPayForm({ amount: p.base_salary != null ? String(p.base_salary) : '', accountId: accounts[0]?.id || '', period: '' }); setError(''); };
  const submitPay = (p) => {
    const amount = Number(payForm.amount);
    if (isNaN(amount) || amount <= 0) { setError('أدخل مبلغاً صحيحاً'); return; }
    if (!payForm.accountId) { setError('اختر الصندوق أو الحساب الذي سيُصرف منه'); return; }
    actions.paySalary(p.id, p.display_name, amount, payForm.accountId, payForm.period.trim());
    setPayingId(null); setError('');
  };

  const paidFor = (profileId) => salaryPayments.filter((s) => s.profile_id === profileId).reduce((s, x) => s + Number(x.amount), 0);
  const recent = salaryPayments.slice(0, 8);

  return (
    <div className="space-y-4">
      <ErrorNote>{error}</ErrorNote>
      <div className="rounded-lg overflow-x-auto" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <table className="w-full text-sm">
          <thead><tr style={{ borderBottom: `1px solid ${C.line}` }}>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الموظف</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الراتب الأساسي</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>إجمالي المصروف</th>
            <th></th>
          </tr></thead>
          <tbody>
            {staff.map((p) => (
              <tr key={p.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                <td className="px-4 py-3 font-bold whitespace-nowrap" style={{ color: C.ink }}>{p.display_name}<div className="text-xs font-normal" style={{ color: C.inkMuted }}>{p.role}</div></td>
                <td className="px-4 py-3 whitespace-nowrap">
                  {editingSalaryId === p.id ? (
                    <div className="flex items-center gap-2">
                      <input type="number" min="0" value={salaryDraft} onChange={(e) => setSalaryDraft(e.target.value)} className="w-28 px-2 py-1 rounded-md text-sm font-mono" style={inputStyle} autoFocus />
                      <button onClick={() => saveSalary(p)} className="text-xs font-bold" style={{ color: C.accent }}>حفظ</button>
                    </div>
                  ) : (
                    <button onClick={() => startEditSalary(p)} className="font-mono text-sm" style={{ color: C.ink }}>{p.base_salary != null ? SAR(p.base_salary) : 'تحديد الراتب'}</button>
                  )}
                </td>
                <td className="px-4 py-3 font-mono whitespace-nowrap" style={{ color: C.inkMuted }}>{SAR(paidFor(p.id))}</td>
                <td className="px-4 py-3 whitespace-nowrap"><button onClick={() => openPay(p)} className="text-xs font-bold px-3 py-1.5 rounded-md" style={{ background: C.accent, color: '#fff' }}>صرف راتب</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {payingId && (() => {
        const p = staff.find((s) => s.id === payingId);
        if (!p) return null;
        return (
          <div className="rounded-lg p-4 space-y-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div className="font-bold text-sm" style={{ color: C.ink }}>صرف راتب — {p.display_name}</div>
            <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
              <Field label="المبلغ"><input type="number" min="0" value={payForm.amount} onChange={(e) => setPayForm({ ...payForm, amount: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
              <Field label="يُصرف من">
                <select value={payForm.accountId} onChange={(e) => setPayForm({ ...payForm, accountId: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
                  <option value="">اختر...</option>
                  {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </Field>
              <Field label="الفترة (اختياري)"><input value={payForm.period} onChange={(e) => setPayForm({ ...payForm, period: e.target.value })} placeholder="مثال: يوليو 2026" className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
            </div>
            <div className="flex gap-2">
              <button onClick={() => submitPay(p)} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>تأكيد الصرف</button>
              <button onClick={() => setPayingId(null)} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
            </div>
          </div>
        );
      })()}

      <div className="rounded-lg p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="font-bold mb-3 text-sm" style={{ color: C.ink }}>آخر عمليات الصرف</div>
        {recent.length === 0 ? <EmptyState text="لا توجد رواتب مصروفة بعد" /> : (
          <div className="space-y-2">
            {recent.map((s) => (
              <div key={s.id} className="flex items-center justify-between text-sm" style={{ borderBottom: `1px solid ${C.line}`, paddingBottom: 6 }}>
                <div><span className="font-bold" style={{ color: C.ink }}>{s.staff_name}</span>{s.period && <span className="text-xs" style={{ color: C.inkMuted }}> · {s.period}</span>}</div>
                <div className="flex items-center gap-2"><span className="font-mono" style={{ color: C.critical }}>{SAR(s.amount)}</span><span className="text-xs font-mono" style={{ color: C.inkFaint }}>{fmtDate(s.created_at)}</span></div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function TreasuryView({ accounts, transactions, staff, salaryPayments, actions, askConfirm, isManager }) {
  const [tab, setTab] = useState('accounts');
  return (
    <div className="p-6 space-y-5">

          <button onClick={() => setTab('payroll')} className="px-4 py-2 text-sm font-bold" style={{ background: tab === 'payroll' ? C.accent : C.surface, color: tab === 'payroll' ? '#fff' : C.inkMuted }}>الرواتب</button>

}

function toDateInputValue(d) { return d.toISOString().slice(0, 10); }

function GeneralReportTab({ accounts, transactions, invoices, purchases }) {
  const today = new Date();
  const firstOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  const [fromDate, setFromDate] = useState(toDateInputValue(firstOfMonth));
  const [toDate, setToDate] = useState(toDateInputValue(today));
  const [accountId, setAccountId] = useState('all');

  const inRange = transactions.filter((t) => {
    const d = new Date(t.created_at);
    const from = new Date(fromDate + 'T00:00:00');
    const to = new Date(toDate + 'T23:59:59');
    const accountMatch = accountId === 'all' || t.account_id === accountId;
    return d >= from && d <= to && accountMatch;
  });

  const totalIn = inRange.filter((t) => t.direction === 'in').reduce((s, t) => s + Number(t.amount), 0);
  const totalOut = inRange.filter((t) => t.direction === 'out').reduce((s, t) => s + Number(t.amount), 0);
  const net = totalIn - totalOut;

  const byCategory = {};
  inRange.forEach((t) => {
    const key = `${t.direction}|${t.category}`;
    byCategory[key] = (byCategory[key] || 0) + Number(t.amount);
  });
  const incomeCats = Object.entries(byCategory).filter(([k]) => k.startsWith('in|')).map(([k, v]) => ({ category: k.slice(3), total: v })).sort((a, b) => b.total - a.total);
  const expenseCats = Object.entries(byCategory).filter(([k]) => k.startsWith('out|')).map(([k, v]) => ({ category: k.slice(4), total: v })).sort((a, b) => b.total - a.total);

  const sortedTx = inRange.slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const receivable = invoices.filter((i) => !i.voided).reduce((s, i) => s + Math.max(0, Number(i.amount) - invoicePaid(i)), 0);
  const payable = purchases.reduce((s, p) => s + Math.max(0, Number(p.total_amount) - purchasePaid(p)), 0);

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-end no-print">
        <button onClick={() => window.print()} className="px-3.5 py-2 rounded-lg text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>طباعة التقرير</button>
      </div>

      <div className="no-print grid grid-cols-2 md:grid-cols-4 gap-3">
        <Field label="من تاريخ"><input type="date" value={fromDate} onChange={(e) => setFromDate(e.target.value)} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={{ ...inputStyle, background: C.surface }} /></Field>
        <Field label="إلى تاريخ"><input type="date" value={toDate} onChange={(e) => setToDate(e.target.value)} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={{ ...inputStyle, background: C.surface }} /></Field>
        <Field label="الحساب">
          <select value={accountId} onChange={(e) => setAccountId(e.target.value)} className="w-full px-3 py-2 rounded-md text-sm" style={{ ...inputStyle, background: C.surface }}>
            <option value="all">كل الحسابات</option>
            {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        </Field>
      </div>

      <div id="report-area" className="space-y-5">
        <div className="hidden print:block mb-4">
          <div className="text-xl font-bold" style={{ color: C.ink }}>مختبر الشموخ — تقرير مالي</div>
          <div className="text-sm" style={{ color: C.inkMuted }}>من {fmtDate(fromDate)} إلى {fmtDate(toDate)}</div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <StatCard label="إجمالي الإيرادات" value={SAR(totalIn)} />
          <StatCard label="إجمالي المصروفات" value={SAR(totalOut)} tone={totalOut ? 'warning' : undefined} />
          <StatCard label="صافي الفترة" value={SAR(net)} tone={net < 0 ? 'critical' : undefined} />
        </div>

        <div>
          <div className="text-xs font-bold mb-2" style={{ color: C.inkMuted }}>لقطة مالية حالية (بغض النظر عن الفترة أعلاه)</div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <StatCard label="مستحق من المرضى (فواتير غير مسدّدة)" value={SAR(receivable)} tone={receivable ? 'warning' : undefined} />
            <StatCard label="مستحق للموردين (مشتريات غير مسدّدة)" value={SAR(payable)} tone={payable ? 'critical' : undefined} />
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div className="rounded-lg p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div className="font-bold mb-3" style={{ color: C.ink }}>الإيرادات حسب التصنيف</div>
            {incomeCats.length === 0 ? <EmptyState text="لا توجد إيرادات في هذه الفترة" /> : (
              <div className="space-y-2">
                {incomeCats.map((c, i) => (
                  <div key={i} className="flex items-center justify-between text-sm">
                    <div style={{ color: C.ink }}>{c.category}</div>
                    <div className="font-mono font-bold" style={{ color: C.normal }}>{SAR(c.total)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
          <div className="rounded-lg p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div className="font-bold mb-3" style={{ color: C.ink }}>المصروفات حسب التصنيف</div>
            {expenseCats.length === 0 ? <EmptyState text="لا توجد مصروفات في هذه الفترة" /> : (
              <div className="space-y-2">
                {expenseCats.map((c, i) => (
                  <div key={i} className="flex items-center justify-between text-sm">
                    <div style={{ color: C.ink }}>{c.category}</div>
                    <div className="font-mono font-bold" style={{ color: C.critical }}>{SAR(c.total)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        <div className="rounded-lg overflow-x-auto" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <table className="w-full text-sm">
            <thead><tr style={{ borderBottom: `1px solid ${C.line}` }}>
              <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>التاريخ</th>
              <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الحساب</th>
              <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>التصنيف</th>
              <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الوصف</th>
              <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>المبلغ</th>
            </tr></thead>
            <tbody>
              {sortedTx.map((t) => {
                const acc = accounts.find((a) => a.id === t.account_id);
                return (
                  <tr key={t.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                    <td className="px-4 py-3 font-mono text-xs whitespace-nowrap" style={{ color: C.inkMuted }}>{fmtDate(t.created_at)}</td>
                    <td className="px-4 py-3 whitespace-nowrap" style={{ color: C.ink }}>{acc?.name}</td>
                    <td className="px-4 py-3 whitespace-nowrap" style={{ color: C.inkMuted }}>{t.category}</td>
                    <td className="px-4 py-3" style={{ color: C.inkMuted }}>{t.description}</td>
                    <td className="px-4 py-3 font-mono font-bold whitespace-nowrap" style={{ color: t.direction === 'in' ? C.normal : C.critical }}>{t.direction === 'in' ? '+' : '-'}{SAR(t.amount)}</td>
                  </tr>
                );
              })}
              {sortedTx.length === 0 && <tr><td colSpan={5}><EmptyState text="لا توجد حركات مالية في هذه الفترة" /></td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function DoctorsCommissionTab({ orders, invoices, referringDoctors, commissionPayments, accounts, actions }) {
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ name: '', phone: '', commissionType: 'percentage', commissionValue: '' });
  const [payingName, setPayingName] = useState(null);
  const [payForm, setPayForm] = useState({ amount: '', accountId: '', notes: '' });
  const [error, setError] = useState('');

  const byDoctor = {};
  orders.filter((o) => o.status === 'completed' && o.referring_doctor).forEach((o) => {
    const inv = invoices.find((i) => i.order_id === o.id);
    const amount = inv && !inv.voided ? Number(inv.amount) : 0;
    const key = o.referring_doctor;
    if (!byDoctor[key]) byDoctor[key] = { name: key, orderCount: 0, totalBilling: 0 };
    byDoctor[key].orderCount += 1;
    byDoctor[key].totalBilling += amount;
  });
  referringDoctors.forEach((d) => { if (!byDoctor[d.name]) byDoctor[d.name] = { name: d.name, orderCount: 0, totalBilling: 0 }; });

  const rows = Object.values(byDoctor).map((row) => {
    const reg = referringDoctors.find((d) => d.name === row.name);
    const owed = reg ? (reg.commission_type === 'percentage' ? row.totalBilling * Number(reg.commission_value) / 100 : row.orderCount * Number(reg.commission_value)) : 0;
    const paid = commissionPayments.filter((c) => c.doctor_name === row.name).reduce((s, c) => s + Number(c.amount), 0);
    return { ...row, registered: Boolean(reg), rate: reg, owed, paid, balance: owed - paid };
  }).sort((a, b) => b.balance - a.balance);

  const resetForm = () => { setForm({ name: '', phone: '', commissionType: 'percentage', commissionValue: '' }); setEditingId(null); setShowForm(false); setError(''); };
  const startEdit = (d) => { setEditingId(d.id); setForm({ name: d.name, phone: d.phone || '', commissionType: d.commission_type, commissionValue: String(d.commission_value) }); setShowForm(true); setError(''); };
  const startRegister = (name) => { setForm({ name, phone: '', commissionType: 'percentage', commissionValue: '' }); setEditingId(null); setShowForm(true); setError(''); };

  const submit = async () => {
    if (!form.name.trim()) { setError('اسم الطبيب مطلوب'); return; }
    const value = Number(form.commissionValue);
    if (isNaN(value) || value < 0) { setError('نسبة/قيمة العمولة يجب أن تكون رقماً موجباً'); return; }
    const payload = { name: form.name.trim(), phone: form.phone.trim() || null, commission_type: form.commissionType, commission_value: value };
    if (editingId) await actions.updateReferringDoctor(editingId, payload); else await actions.addReferringDoctor(payload);
    resetForm();
  };

  const openPay = (row) => { setPayingName(row.name); setPayForm({ amount: row.balance > 0 ? String(row.balance) : '', accountId: accounts[0]?.id || '', notes: '' }); setError(''); };
  const submitPay = async () => {
    const amount = Number(payForm.amount);
    if (isNaN(amount) || amount <= 0) { setError('أدخل مبلغاً صحيحاً'); return; }
    if (!payForm.accountId) { setError('اختر الحساب الذي سيُصرف منه'); return; }
    await actions.payDoctorCommission(payingName, amount, payForm.accountId, payForm.notes.trim());
    setPayingName(null); setError('');
  };

  return (
    <div className="space-y-4">
      <div className="flex justify-between items-center flex-wrap gap-2">
        <div className="text-xs" style={{ color: C.inkMuted }}>تُحسب العمولة على الطلبات المكتملة المرتبطة باسم الطبيب المُدخل عند إنشاء الطلب.</div>
        <button onClick={() => (showForm ? resetForm() : setShowForm(true))} className="px-3.5 py-2 rounded-lg text-sm font-bold whitespace-nowrap" style={{ background: C.accent, color: '#fff' }}>+ طبيب محوّل</button>
      </div>
      <ErrorNote>{error}</ErrorNote>
      {showForm && (
        <div className="rounded-lg p-4 space-y-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <Field label="اسم الطبيب"><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
            <Field label="الهاتف (اختياري)"><input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
            <Field label="نوع العمولة">
              <select value={form.commissionType} onChange={(e) => setForm({ ...form, commissionType: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
                <option value="percentage">نسبة % من قيمة الفاتورة</option>
                <option value="fixed">مبلغ ثابت لكل طلب</option>
              </select>
            </Field>
            <Field label={form.commissionType === 'percentage' ? 'النسبة %' : 'المبلغ لكل طلب'}><input type="number" min="0" value={form.commissionValue} onChange={(e) => setForm({ ...form, commissionValue: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
          </div>
          <div className="flex gap-2">
            <button onClick={submit} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>{editingId ? 'حفظ التعديلات' : 'حفظ'}</button>
            <button onClick={resetForm} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
          </div>
        </div>
      )}
      <div className="rounded-lg overflow-x-auto" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <table className="w-full text-sm">
          <thead><tr style={{ borderBottom: `1px solid ${C.line}` }}>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الطبيب</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>عدد الطلبات</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>العمولة</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>المستحق</th>
            <th></th>
          </tr></thead>
          <tbody>
            {rows.map((row) => (
              <tr key={row.name} style={{ borderBottom: `1px solid ${C.line}` }}>
                <td className="px-4 py-3 font-bold whitespace-nowrap" style={{ color: C.ink }}>د. {row.name}</td>
                <td className="px-4 py-3 font-mono whitespace-nowrap" style={{ color: C.inkMuted }}>{row.orderCount}</td>
                <td className="px-4 py-3 whitespace-nowrap">
                  {row.registered ? <span className="text-xs" style={{ color: C.inkMuted }}>{row.rate.commission_type === 'percentage' ? `${row.rate.commission_value}%` : SAR(row.rate.commission_value) + ' / طلب'}</span> : <Badge tone="warning">غير مسجّل</Badge>}
                </td>
                <td className="px-4 py-3 font-mono font-bold whitespace-nowrap" style={{ color: row.balance > 0 ? C.critical : C.inkMuted }}>{SAR(row.balance)}</td>
                <td className="px-4 py-3 whitespace-nowrap">
                  <div className="flex items-center gap-3">
                    {row.registered ? <button onClick={() => startEdit(row.rate)} className="text-xs font-bold" style={{ color: C.accent }}>تعديل</button> : <button onClick={() => startRegister(row.name)} className="text-xs font-bold" style={{ color: C.accent }}>تسجيل العمولة</button>}
                    {row.registered && row.orderCount === 0 && <button onClick={() => actions.deleteReferringDoctor(row.rate.id, row.name)} className="text-xs font-bold" style={{ color: C.critical }}>حذف</button>}
                    {row.balance > 0 && <button onClick={() => openPay(row)} className="text-xs font-bold" style={{ color: C.normal }}>صرف</button>}
                  </div>
                </td>
              </tr>
            ))}
            {rows.length === 0 && <tr><td colSpan={5}><EmptyState text="لا يوجد أطباء محوّلون بعد" /></td></tr>}
          </tbody>
        </table>
      </div>

      {payingName && (
        <div className="rounded-lg p-4 space-y-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="font-bold text-sm" style={{ color: C.ink }}>صرف عمولة — د. {payingName}</div>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            <Field label="المبلغ"><input type="number" min="0" value={payForm.amount} onChange={(e) => setPayForm({ ...payForm, amount: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
            <Field label="يُصرف من">
              <select value={payForm.accountId} onChange={(e) => setPayForm({ ...payForm, accountId: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
                <option value="">اختر...</option>
                {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </Field>
            <Field label="ملاحظات (اختياري)"><input value={payForm.notes} onChange={(e) => setPayForm({ ...payForm, notes: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
          </div>
          <div className="flex gap-2">
            <button onClick={submitPay} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>تأكيد الصرف</button>
            <button onClick={() => setPayingName(null)} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
          </div>
        </div>
      )}
    </div>
  );
}
