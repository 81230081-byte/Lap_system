<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة مختبر الشموخ الطبي</title>

  <!-- التنسيقات والمكتبات الأساسية -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- تنسيقات الطباعة: تُخفي عناصر التحكم (no-print) وتُظهر منطقة التقرير فقط عند الطباعة -->
  <style>
    @media print {
      .no-print { display: none !important; }
      body * { visibility: hidden; }
      .printable-area, .printable-area *, #report-area, #report-area * { visibility: visible; }
      .printable-area, #report-area { position: absolute; top: 0; right: 0; left: 0; width: 100%; border: none !important; }
      .hidden.print\:block { display: block !important; }
    }

    /* صندوق الأخطاء: يغطي الشاشة حتى لو فشل التطبيق بالكامل */
    #debug-box {
      display: none;
      position: fixed;
      inset: 16px;
      z-index: 99999;
      background: rgba(255, 255, 255, 0.98);
      border: 2px solid #f87171; /* red-400 */
      color: #991b1b; /* red-700 */
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      overflow: auto;
      direction: rtl;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Helvetica Neue", monospace;
      font-size: 13px;
      line-height: 1.4;
    }

    #debug-box .actions { margin-top: 12px; display:flex; gap:8px; justify-content: flex-start; }
    #debug-box button { background: #B3402A; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-weight: bold; cursor: pointer; font-family: inherit; }
    #debug-box pre { background: #111827; color: #e5e7eb; padding: 10px; border-radius: 6px; overflow:auto; white-space: pre-wrap; word-break: break-word; direction: ltr; }

    #loading-hint {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: sans-serif; color: #5B665F; font-size: 14px; direction: rtl;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <!-- شاشة تنبيه الأخطاء -->
  <div id="debug-box" role="alert" aria-live="assertive"></div>
  <div id="loading-hint">...جارِ تحميل النظام (قد يستغرق حتى 30 ثانية على شبكة بطيئة)</div>

  <!-- مكان عرض التطبيق -->
  <div id="root"></div>

  <!-- سكريبت الدمج والتشغيل الموحد -->
  <script>
    // Small utility to safely escape text when needed (we prefer textContent but keep for completeness)
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Build a robust error panel and show it. Avoid innerHTML for untrusted content.
    function showErrorPanel(info) {
      try {
        const box = document.getElementById('debug-box');
        if (!box) return console.error('debug-box not found', info);
        // replaceChildren is safer than innerHTML = ''
        box.replaceChildren();
        box.style.display = 'block';

        const title = document.createElement('div');
        title.style.fontSize = '16px';
        title.style.marginBottom = '8px';
        title.style.fontWeight = '700';
        title.textContent = 'حدث خطأ أثناء تشغيل التطبيق';
        box.appendChild(title);

        const list = document.createElement('div');

        function addRow(label, value, isPre) {
          const row = document.createElement('div');
          row.style.marginBottom = '6px';

          const lab = document.createElement('div');
          lab.style.fontWeight = '600';
          lab.style.display = 'inline-block';
          lab.style.minWidth = '90px';
          lab.textContent = label + ':';

          row.appendChild(lab);

          if (isPre) {
            const pre = document.createElement('pre');
            pre.textContent = value == null ? '' : value;
            row.appendChild(pre);
          } else {
            const span = document.createElement('span');
            span.style.marginRight = '6px';
            span.textContent = value == null ? '' : value;
            row.appendChild(span);
          }
          list.appendChild(row);
        }

        // Standard fields
        addRow('نوع', info.type || 'خطأ جافاسكربت');
        addRow('الرسالة', info.message || (info.error && info.error.message) || 'بدون رسالة');
        if (info.filename) addRow('الملف', info.filename);
        if (info.lineno != null || info.colno != null) addRow('السطر:العمود', (info.lineno || '?') + ':' + (info.colno || '?'));
        if (info.stack) addRow('Stack Trace', info.stack, true);

        // Resource loading info
        if (info.resource) {
          addRow('المورد', info.resource);
          addRow('عنصر', info.targetTag || '');
        }

        // Raw object for debugging
        if (info.raw) addRow('raw', typeof info.raw === 'string' ? info.raw : JSON.stringify(info.raw, Object.getOwnPropertyNames(info.raw || {}), 2), true);

        box.appendChild(list);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const reloadBtn = document.createElement('button');
        reloadBtn.textContent = 'إعادة تحميل الصفحة';
        reloadBtn.onclick = function () { location.reload(); };
        actions.appendChild(reloadBtn);

        const copyBtn = document.createElement('button');
        copyBtn.textContent = 'نسخ تفاصيل الخطأ';
        copyBtn.onclick = function () {
          const toCopy = JSON.stringify(info, Object.getOwnPropertyNames(info || {}), 2);
          navigator.clipboard && navigator.clipboard.writeText(toCopy).then(function(){
            copyBtn.textContent = 'تم النسخ';
            setTimeout(()=> copyBtn.textContent = 'نسخ تفاصيل الخطأ', 2000);
          }).catch(()=>{
            // fallback
            alert('تعذر نسخ التفاصيل — انسخها يدوياً');
          });
        };
        actions.appendChild(copyBtn);

        box.appendChild(actions);

        // Also log to console in structured way
        try { console.error('Application error captured:', info); } catch (e) {}
      } catch (e) {
        // If the error overlay building itself fails, fallback to a minimal alert so user isn't left with white screen
        try { alert('خطأ خطير: ' + (e && e.message)); } catch (e2) {}
      }
    }

    // Global handlers: catch runtime errors, resource load failures and unhandled promise rejections
    window.addEventListener('error', function (event) {
      try {
        // Resource loading error: event.target is the failed element (script/link/img)
        if (event.target && (event.target.src || event.target.href)) {
          const resource = event.target.src || event.target.href;
          showErrorPanel({
            type: 'خطأ تحميل مورد',
            message: 'فشل تحميل مورد (network/resource error)',
            resource: resource,
            targetTag: event.target.tagName,
            raw: {
              tagName: event.target.tagName,
              outerHTML: (event.target && event.target.outerHTML) ? event.target.outerHTML : undefined
            }
          });
          // prevent default browser logging duplication
          event.preventDefault && event.preventDefault();
          return;
        }

        // JS runtime error
        const info = {
          type: 'خطأ وقت التشغيل',
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          stack: (event.error && event.error.stack) || null,
          raw: event.error || null
        };
        showErrorPanel(info);
        event.preventDefault && event.preventDefault();
      } catch (e) {
        console.error('error handler failed', e);
      }
    }, true);

    window.addEventListener('unhandledrejection', function (event) {
      try {
        const reason = event.reason;
        let message = '';
        let stack = null;
        if (!reason) {
          message = 'Unhandled rejection with no reason';
        } else if (reason instanceof Error) {
          message = reason.message;
          stack = reason.stack;
        } else {
          try { message = JSON.stringify(reason); } catch (e) { message = String(reason); }
        }

        showErrorPanel({
          type: 'Unhandled Promise Rejection',
          message: message,
          stack: stack,
          raw: reason
        });
        event.preventDefault && event.preventDefault();
      } catch (e) {
        console.error('unhandledrejection handler failed', e);
      }
    });

    // ينتظر توفّر متغيّر عام (مكتبة CDN) مع مهلة، بدل الفشل الفوري إذا تأخرت الشبكة
    function waitForGlobal(name, timeoutMs, intervalMs) {
      timeoutMs = timeoutMs || 30000;
      intervalMs = intervalMs || 200;
      return new Promise((resolve, reject) => {
        const start = Date.now();
        const check = () => {
          if (typeof window[name] !== 'undefined') return resolve();
          if (Date.now() - start > timeoutMs) {
            return reject(new Error(`تعذر تحميل مكتبة \"${name}\" — الشبكة بطيئة أو غير مستقرة. تحقق من الاتصال (يفضّل واي فاي) وأعد المحاولة.`));
          }
          setTimeout(check, intervalMs);
        };
        check();
      });
    }

    // يجلب ملفاً نصياً مع إعادة محاولة تلقائية عند فشل الشبكة المؤقت
    async function fetchWithRetry(url, retries, delayMs) {
      retries = retries || 4;
      delayMs = delayMs || 900;
      let lastErr;
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) throw new Error(`رمز الخطأ: ${res.status}`);
          return await res.text();
        } catch (err) {
          lastErr = err;
          if (i < retries - 1) await new Promise((r) => setTimeout(r, delayMs * (i + 1)));
        }
      }
      throw new Error(`تعذر تحميل الملف: ${url} (${lastErr && lastErr.message})`);
    }

    function splitCombinedByFile(combinedCode) {
      // split using the marker /* --- File: filename --- */\n
      const parts = combinedCode.split(/\/\*\s--- File:\s*(.+?)\s--- \*\/[\r\n]?/);
      // resulting array: [prefix, filename1, content1, filename2, content2, ...]
      const files = [];
      for (let i = 1; i < parts.length; i += 2) {
        const filename = parts[i];
        const content = parts[i + 1] || '';
        files.push({ filename, content });
      }
      return files;
    }

    function findForbiddenInContent(content) {
      const results = [];
      const checks = [
        { name: 'static import', re: /(^|[^\w$])import\b/m },
        { name: 'static export', re: /(^|[^\w$])export\b/m },
        { name: 'dynamic import with object', re: /import\s*\(\s*\{/m },
        { name: '<script tag', re: /<script\b/i },
        { name: '</script tag', re: /<\/script>/i },
        { name: '<html tag', re: /<html\b/i },
        { name: '<!DOCTYPE', re: /<!DOCTYPE/i },
        { name: 'leading object', re: /^\s*\{/m }
      ];
      for (const c of checks) {
        const m = c.re.exec(content);
        if (m) {
          results.push({ type: c.name, index: m.index, match: m[0] });
        }
      }
      return results;
    }

    async function launchApp() {
      const debugBox = document.getElementById('debug-box');
      const loadingHint = document.getElementById('loading-hint');

      // قائمة كافة ملفات النظام بالترتيب الصحيح
      const files = [
        '01-config.js',
        '02-helpers.js',
        '03-ui-kit.jsx',
        '04-login.jsx',
        '05-layout.jsx',
        '06-dashboard.jsx',
        '07-patients.jsx',
        '08-orders-results.jsx',
        '09-inventory.jsx',
        '10-suppliers-purchases.jsx',
        '11-treasury.jsx',
        '12-financial-reports.jsx',
        '13-ledger-and-coa.jsx',
        '14-billing.jsx',
        '15-audit-log.jsx',
        '16-settings.jsx',
        '17-app-shell.jsx',
        '19-appointments.jsx',
        '21-quality-control.jsx',
        '20-main.jsx' // يجب أن يكون الملف الرئيسي في النهاية
      ];

      try {
        // الخطوة 1: تأكد من اكتمال تحميل المكتبات الخارجية (تتحمّل بطء الشبكة تلقائياً)
        await waitForGlobal('React');
        await waitForGlobal('ReactDOM');
        await waitForGlobal('Babel');
        await waitForGlobal('supabase');

        // الخطوة 2: جلب وقراءة كافة ملفات النظام (مع إعادة محاولة لكل ملف عند فشل الشبكة)
        let combinedCode = '';
        for (const file of files) {
          const text = await fetchWithRetry('./' + file);
          combinedCode += `\n/* --- File: ${file} --- */\n` + text;
        }

        // Pre-Babel: inspect each file's content for forbidden tokens
        const splitFiles = splitCombinedByFile(combinedCode);
        for (const f of splitFiles) {
          const issues = findForbiddenInContent(f.content);
          if (issues.length) {
            // report first issue with context
            const issue = issues[0];
            const lines = f.content.split(/\r?\n/);
            const approxLine = f.content.slice(0, issue.index).split(/\r?\n/).length;
            const from = Math.max(0, approxLine - 4);
            const to = Math.min(lines.length, approxLine + 4);
            const context = lines.slice(from, to).join('\n');
            showErrorPanel({
              type: 'Diagnostic: forbidden syntax before Babel',
              message: `تم العثور على ${issue.type} في الملف قبل التحويل بواسطة Babel — لن يتم تنفيذ الشفرة.`,
              filename: f.filename,
              lineno: approxLine,
              raw: context
            });
            return; // stop execution
          }
        }

        // الخطوة 3: تحويل الكود المدمج عبر Babel
        let transpiledCode;
        try {
          transpiledCode = Babel.transform(combinedCode, {
            presets: ['react']
          }).code;
        } catch (babelErr) {
          // Capture Babel transpilation errors with details
          showErrorPanel({
            type: 'خطأ أثناء تحويل Babel',
            message: babelErr.message || 'خطأ أثناء تحويل الكود',
            stack: babelErr.stack || null,
            raw: babelErr
          });
          return;
        }

        // Post-Babel: inspect transpiled code for import/export tokens
        // If present, try to map back to source file using combinedCode markers
        const postChecks = [/\bimport\s*\(/, /\bimport\s+/, /\bexport\b/];
        for (const rx of postChecks) {
          const m = rx.exec(transpiledCode);
          if (m) {
            // try to locate which original file contains the token
            let foundFile = null;
            for (const f of splitFiles) {
              if (f.content && rx.test(f.content)) { foundFile = f; break; }
            }
            // compute line in transpiledCode for context
            const idx = m.index;
            const tlines = transpiledCode.slice(Math.max(0, idx - 300), Math.min(transpiledCode.length, idx + 300)).split(/\r?\n/);

            showErrorPanel({
              type: 'Diagnostic: forbidden syntax after Babel',
              message: `الكود الناتج بعد Babel يحتوي على "${m[0].trim()}" — لا يمكن تنفيذ هذا كـ classic script.`,
              filename: foundFile ? foundFile.filename : 'unknown (in transpiled output)',
              lineno: foundFile ? (f.content.slice(0, f.content.indexOf(m[0]) )).split(/\r?\n/).length : null,
              raw: tlines.join('\n')
            });
            return;
          }
        }

        // Step 4: finally execute the transpiled code as a blob script
        loadingHint && loadingHint.remove();

        try {
          const blob = new Blob([transpiledCode], { type: 'application/javascript' });
          const blobUrl = URL.createObjectURL(blob);
          const scriptElement = document.createElement('script');
          scriptElement.src = blobUrl;
          scriptElement.onload = function () { URL.revokeObjectURL(blobUrl); };
          scriptElement.onerror = function (ev) {
            showErrorPanel({ type: 'خطأ تحميل السكريبت', message: 'فشل تحميل أو تنفيذ السكريبت المدمج', raw: ev });
          };
          document.body.appendChild(scriptElement);
        } catch (e) {
          // As a fallback, try direct injection and let global handlers catch runtime errors
          try {
            const scriptElement = document.createElement('script');
            scriptElement.text = transpiledCode;
            document.body.appendChild(scriptElement);
          } catch (ex) {
            showErrorPanel({ type: 'خطأ عند إدراج السكريبت', message: ex.message, stack: ex.stack, raw: ex });
          }
        }

      } catch (err) {
        try { loadingHint && loadingHint.remove(); } catch (e) {}
        showErrorPanel({ type: 'خطأ أثناء بدء التطبيق', message: err.message, stack: err.stack, raw: err });
      }
    }

    // بدء التشغيل عند اكتمال تحميل الصفحة
    window.addEventListener('DOMContentLoaded', launchApp);
  </script>
</body>
</html>
