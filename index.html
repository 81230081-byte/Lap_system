<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مختبر الشموخ الطبي</title>

  <!-- 1. مكتبة التنسيقات Tailwind CSS المبنية -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <!-- 2. مكتبات React و ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- 3. محول الأكواد Babel لتشغيل JSX داخل المتصفح -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 4. سكريبت التقاط الأخطاء البرمجية وعرضها مباشرة على الشاشة -->
  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('debug-box');
      if (box) {
        box.style.display = 'block';
        box.innerHTML = '<b style="color:red">تفاصيل الخطأ الدقيقة:</b><br><br>' +
          '<b>الرسالة:</b> ' + (e.message || 'Script Error') + '<br>' +
          '<b>الملف:</b> ' + (e.filename || 'غير معروف') + '<br>' +
          '<b>السطر:</b> ' + (e.lineno || 0) + ' | <b>العمود:</b> ' + (e.colno || 0);
      }
    });
  </script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <!-- مربع كشف الأخطاء (يظهر فقط إذا حدثت مشكلة) -->
  <div id="debug-box" style="display:none; background:#fee2e2; color:#991b1b; padding:15px; margin:15px; border-radius:8px; border:2px solid #ef4444; font-family:monospace; direction:ltr; text-align:left;"></div>

  <!-- مكان تشغيل واجهة النظام -->
  <div id="root"></div>

  <!-- 5. استدعاء كافة ملفات المشروع بالترتيب الصحيح -->
  <script type="text/babel" src="01-config.js"></script>
  <script type="text/babel" src="02-helpers.js"></script>
  <script type="text/babel" src="03-ui-kit.jsx"></script>
  <script type="text/babel" src="04-login.jsx"></script>
  <script type="text/babel" src="05-layout.jsx"></script>
  <script type="text/babel" src="06-dashboard.jsx"></script>
  <script type="text/babel" src="07-patients.jsx"></script>
  <script type="text/babel" src="08-orders-results.jsx"></script>
  <script type="text/babel" src="09-inventory.jsx"></script>
  <script type="text/babel" src="10-suppliers-purchases.jsx"></script>
  <script type="text/babel" src="11-treasury.jsx"></script>
  <script type="text/babel" src="12-financial-reports.jsx"></script>
  <script type="text/babel" src="13-ledger-and-coa.jsx"></script>
  <script type="text/babel" src="14-billing.jsx"></script>
  <script type="text/babel" src="15-audit-log.jsx"></script>
  <script type="text/babel" src="16-settings.jsx"></script>
  <script type="text/babel" src="17-app-shell.jsx"></script>
  <script type="text/babel" src="19-appointments.jsx"></script>
  <script type="text/babel" src="21-quality-control.jsx"></script>
  
  <!-- ملف التشغيل الرئيسي يتم استدعاؤه في النهاية -->
  <script type="text/babel" src="20-main.jsx"></script>
</body>
</html>
