function BillingView({ invoices, orders, patients, accounts, actions }) {
  const [expandedId, setExpandedId] = useState(null);
  const [payForm, setPayForm] = useState({ amount: '', method: 'نقدي', accountId: accounts[0]?.id || '' });
  const [error, setError] = useState('');
  const collected = invoices.reduce((s, i) => s + invoicePaid(i), 0);
  const pending = invoices.reduce((s, i) => s + Math.max(0, i.amount - invoicePaid(i)), 0);
  const { page, setPage, totalPages, pageItems } = usePagination(invoices, 6);

  const unpaidByPatient = {};
  invoices.forEach((inv) => {
    if (inv.voided) return;
    const remaining = Math.max(0, inv.amount - invoicePaid(inv));
    if (remaining <= 0) return;
    const order = orders.find((o) => o.id === inv.order_id);
    const patient = patients.find((p) => p.id === order?.patient_id);
    if (!patient) return;
    unpaidByPatient[patient.id] = (unpaidByPatient[patient.id] || 0) + remaining;
  });
  const unpaidList = Object.entries(unpaidByPatient)
    .map(([pid, total]) => ({ patient: patients.find((p) => p.id === pid), total }))
    .sort((a, b) => b.total - a.total);

  const openPay = (inv) => { setExpandedId(inv.id === expandedId ? null : inv.id); setPayForm({ amount: '', method: 'نقدي', accountId: accounts[0]?.id || '' }); setError(''); };
  const submitPayment = async (inv) => {
    const amount = Number(payForm.amount);
    const remaining = inv.amount - invoicePaid(inv);
    if (isNaN(amount) || amount <= 0) { setError('أدخل مبلغاً صحيحاً أكبر من صفر'); return; }
    if (amount > remaining) { setError(`المبلغ أكبر من المتبقي (${SAR(remaining)})`); return; }
    if (!payForm.accountId) { setError('اختر الصندوق أو الحساب البنكي المستلم'); return; }
    await actions.addPayment(inv.id, amount, payForm.method, payForm.accountId);
    setExpandedId(null); setError('');
  };

  return (
    <div className="p-6 space-y-5">
      <div className="text-2xl font-bold" style={{ color: C.ink }}>الفواتير</div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <StatCard label="إجمالي المحصّل" value={SAR(collected)} />
        <StatCard label="قيد التحصيل" value={SAR(pending)} tone={pending ? 'warning' : undefined} />
      </div>

      {unpaidList.length > 0 && (
        <div className="rounded-lg p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="font-bold mb-3" style={{ color: C.ink }}>حسابات المرضى غير المسددة</div>
          <div className="space-y-2">
            {unpaidList.map(({ patient, total }) => (
              <div key={patient.id} className="flex items-center justify-between py-1.5" style={{ borderBottom: `1px solid ${C.line}` }}>
                <div className="text-sm font-bold" style={{ color: C.ink }}>{patient.name}</div>
                <div className="text-sm font-mono font-bold" style={{ color: C.critical }}>{SAR(total)}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="rounded-lg overflow-x-auto" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <table className="w-full text-sm">
          <thead><tr style={{ borderBottom: `1px solid ${C.line}` }}>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>المريض</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الإجمالي</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>المتبقي</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الحالة</th>
            <th></th>
          </tr></thead>
          <tbody>
            {pageItems.map((inv) => {
              const order = orders.find((o) => o.id === inv.order_id);
              const patient = patients.find((p) => p.id === order?.patient_id);
              const status = invoiceStatus(inv);
              const remaining = Math.max(0, inv.amount - invoicePaid(inv));
              const statusMap = { unpaid: ['warning', 'غير مدفوعة'], partial: ['accent', 'جزئية'], paid: ['normal', 'مدفوعة'], voided: ['muted', 'ملغاة'] };
              return (

                    <td className="px-4 py-3 whitespace-nowrap">{status !== 'paid' && status !== 'voided' && <button onClick={() => openPay(inv)} className="text-xs font-bold" style={{ color: C.accent }}>تسجيل دفعة</button>}</td>

                          <Field label="طريقة الدفع"><select value={payForm.method} onChange={(e) => setPayForm({ ...payForm, method: e.target.value })} className="px-3 py-2 rounded-md text-sm" style={{ ...inputStyle, background: C.surface }}><option>نقدي</option><option>بطاقة</option><option>تحويل بنكي</option><option>تأمين طبي</option></select></Field>
                          <Field label="الصندوق/الحساب المستلم"><select value={payForm.accountId} onChange={(e) => setPayForm({ ...payForm, accountId: e.target.value })} className="px-3 py-2 rounded-md text-sm" style={{ ...inputStyle, background: C.surface }}>{accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}</select></Field>
                          <button onClick={() => submitPayment(inv)} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>تأكيد</button>
                          <button onClick={() => setExpandedId(null)} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>
                        </div>
                        <ErrorNote>{error}</ErrorNote>
                        {inv.payments && inv.payments.length > 0 && <div className="mt-3 text-xs space-y-1" style={{ color: C.inkMuted }}>{inv.payments.map((p) => <div key={p.id}>{fmtDate(p.created_at)} · {SAR(p.amount)} · {p.method}</div>)}</div>}
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
        <PaginationBar page={page} totalPages={totalPages} setPage={setPage} />
      </div>
    </div>
  );
}

function TestsTab({ catalog, inventory, orders, actions, askConfirm, isManager }) {
  const blank = { name: '', unit: '', min: '', max: '', price: '', differentForFemale: false, minF: '', maxF: '', criticalLow: '', criticalHigh: '', consumesItemId: '', consumesQty: '1' };
  const [form, setForm] = useState(blank);
  const [editingId, setEditingId] = useState(null);
  const [error, setError] = useState('');

  const resetForm = () => { setForm(blank); setEditingId(null); setError(''); };
  const startEdit = (t) => {
    setEditingId(t.id);
    setForm({
      name: t.name, unit: t.unit || '', min: String(t.min), max: String(t.max), price: String(t.price),
      differentForFemale: t.min_female !== null && t.min_female !== undefined,
      minF: t.min_female !== null && t.min_female !== undefined ? String(t.min_female) : '',
      maxF: t.max_female !== null && t.max_female !== undefined ? String(t.max_female) : '',
      criticalLow: t.critical_low !== null && t.critical_low !== undefined ? String(t.critical_low) : '',
      criticalHigh: t.critical_high !== null && t.critical_high !== undefined ? String(t.critical_high) : '',
      consumesItemId: t.consumes_item_id || '', consumesQty: t.consumes_qty ? String(t.consumes_qty) : '1',
    });
    setError('');
  };

  const submit = async () => {
    if (!form.name.trim()) { setError('اسم الفحص مطلوب'); return; }
    const min = Number(form.min), max = Number(form.max), price = Number(form.price);
    if (isNaN(min) || isNaN(max) || min >= max) { setError('يجب أن يكون الحد الأدنى أصغر من الحد الأقصى'); return; }
    if (isNaN(price) || price < 0) { setError('السعر يجب أن يكون رقماً موجباً'); return; }
    const payload = {
      name: form.name.trim(), unit: form.unit.trim(), min, max, price,
      min_female: form.differentForFemale ? Number(form.minF || min) : null,
      max_female: form.differentForFemale ? Number(form.maxF || max) : null,
      critical_low: form.criticalLow !== '' ? Number(form.criticalLow) : null,
      critical_high: form.criticalHigh !== '' ? Number(form.criticalHigh) : null,
      consumes_item_id: form.consumesItemId || null,
      consumes_qty: form.consumesItemId ? Number(form.consumesQty) || 1 : null,
    };
    if (editingId) await actions.updateTest(editingId, payload); else await actions.addTest(payload);
    resetForm();
  };

  const onDelete = (t) => {
    const used = orders.some((o) => o.test_ids.includes(t.id));
    if (used) { setError(`لا يمكن حذف "${t.name}" — مستخدم في طلبات موجودة`); return; }
    askConfirm({ title: 'حذف فحص', message: `هل تريد حذف "${t.name}"؟`, danger: true, onConfirm: () => actions.deleteTest(t.id, t.name) });
  };

  return (
    <div className="space-y-5">
      {isManager && <div className="rounded-lg p-4 space-y-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
          <Field label="اسم الفحص"><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
          <Field label="الوحدة"><input value={form.unit} onChange={(e) => setForm({ ...form, unit: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
          <Field label="الحد الأدنى"><input type="number" step="any" value={form.min} onChange={(e) => setForm({ ...form, min: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
          <Field label="الحد الأقصى"><input type="number" step="any" value={form.max} onChange={(e) => setForm({ ...form, max: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
          <Field label="السعر"><input type="number" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
        </div>
        <label className="flex items-center gap-2 text-sm" style={{ color: C.ink }}><input type="checkbox" checked={form.differentForFemale} onChange={(e) => setForm({ ...form, differentForFemale: e.target.checked })} /> معدل مختلف للإناث</label>
        {form.differentForFemale && (
          <div className="grid grid-cols-2 gap-3">
            <Field label="الحد الأدنى (أنثى)"><input type="number" step="any" value={form.minF} onChange={(e) => setForm({ ...form, minF: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
            <Field label="الحد الأقصى (أنثى)"><input type="number" step="any" value={form.maxF} onChange={(e) => setForm({ ...form, maxF: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
          </div>
        )}
        <div className="grid grid-cols-2 gap-3">
          <Field label="الحد الحرج الأدنى (اختياري)"><input type="number" step="any" value={form.criticalLow} onChange={(e) => setForm({ ...form, criticalLow: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
          <Field label="الحد الحرج الأعلى (اختياري)"><input type="number" step="any" value={form.criticalHigh} onChange={(e) => setForm({ ...form, criticalHigh: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="يستهلك من المخزون (اختياري)">
            <select value={form.consumesItemId} onChange={(e) => setForm({ ...form, consumesItemId: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle}>
              <option value="">بدون</option>
              {inventory.map((i) => <option key={i.id} value={i.id}>{i.name}</option>)}
            </select>
          </Field>
          {form.consumesItemId && <Field label="الكمية المستهلكة لكل فحص"><input type="number" min="1" value={form.consumesQty} onChange={(e) => setForm({ ...form, consumesQty: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>}
        </div>
        <ErrorNote>{error}</ErrorNote>
        <div className="flex gap-2">
          <button onClick={submit} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>{editingId ? 'حفظ التعديلات' : 'إضافة فحص'}</button>
          {editingId && <button onClick={resetForm} className="px-4 py-2 rounded-md text-sm font-bold" style={{ border: `1px solid ${C.line}`, color: C.inkMuted }}>إلغاء</button>}
        </div>
      </div>}
      <div className="rounded-lg overflow-x-auto" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <table className="w-full text-sm">
          <thead><tr style={{ borderBottom: `1px solid ${C.line}` }}>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الفحص</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>المعدل</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>السعر</th>
            <th></th>
          </tr></thead>
          <tbody>
            {catalog.map((c) => (
              <tr key={c.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                <td className="px-4 py-3 font-bold whitespace-nowrap" style={{ color: C.ink }}>{c.name}</td>
                <td className="px-4 py-3 font-mono text-xs whitespace-nowrap" style={{ color: C.inkMuted }}>{c.min}–{c.max} {c.unit}{c.min_female !== null && c.min_female !== undefined ? ' (حسب الجنس)' : ''}</td>
                <td className="px-4 py-3 font-mono whitespace-nowrap" style={{ color: C.ink }}>{SAR(c.price)}</td>
                <td className="px-4 py-3 whitespace-nowrap">{isManager && <div className="flex items-center gap-3"><button onClick={() => startEdit(c)} className="text-xs font-bold" style={{ color: C.accent }}>تعديل</button><button onClick={() => onDelete(c)} className="text-xs font-bold" style={{ color: C.critical }}>حذف</button></div>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function LabInfoTab({ labSettings, actions, isManager }) {

  const [saved, setSaved] = useState(false);

  useEffect(() => {
    setForm({
      name: labSettings?.name || '', phone: labSettings?.phone || '', email: labSettings?.email || '',
      address: labSettings?.address || '', report_footer: labSettings?.report_footer || '', logo_b64: labSettings?.logo_b64 || '',

  const save = async () => {
    await actions.updateLabSettings({
      name: form.name.trim() || 'مختبر الشموخ', phone: form.phone.trim() || null, email: form.email.trim() || null,
      address: form.address.trim() || null, report_footer: form.report_footer.trim() || null, logo_b64: form.logo_b64.trim() || null,

        <Field label="البريد الإلكتروني"><input disabled={!isManager} value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm font-mono" style={inputStyle} /></Field>
        <Field label="العنوان"><input disabled={!isManager} value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
      </div>
      <Field label="ملاحظة أسفل التقرير المطبوع (اختياري)"><input disabled={!isManager} value={form.report_footer} onChange={(e) => setForm({ ...form, report_footer: e.target.value })} className="w-full px-3 py-2 rounded-md text-sm" style={inputStyle} /></Field>
      {isManager && (
        <Field label="شعار المختبر (الصق Base64 أو رابط صورة — اتركه فارغاً لاستخدام الشعار الافتراضي)">
          <textarea value={form.logo_b64} onChange={(e) => setForm({ ...form, logo_b64: e.target.value })} rows={2} className="w-full px-3 py-2 rounded-md text-xs font-mono" style={inputStyle} placeholder="data:image/png;base64,... أو https://..." />
        </Field>
      )}
      {isManager
        ? <button onClick={save} className="px-4 py-2 rounded-md text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>{saved ? '✓ تم الحفظ' : 'حفظ'}</button>
        : <div className="text-xs" style={{ color: C.inkFaint }}>عرض فقط — التعديل متاح للمدير</div>}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Staff tab (manager only)
// ---------------------------------------------------------------------------
function StaffTab({ staff, actions, myId }) {
  const [error, setError] = useState('');

  const changeRole = (p, newRole) => {
    if (p.id === myId) { setError('لا يمكنك تغيير صلاحيتك الخاصة'); return; }
    setError('');
    actions.updateStaffRole(p.id, p.display_name, newRole);
  };
  const toggleActive = (p) => {
    if (p.id === myId) { setError('لا يمكنك تعطيل حسابك الخاص'); return; }
    setError('');
    actions.updateStaffActive(p.id, p.display_name, !(p.active !== false));
  };

  return (
    <div className="space-y-3">
      <div className="text-xs px-1" style={{ color: C.inkMuted }}>لإضافة موظف جديد: لوحة Supabase ← Authentication ← Add User، ثم حدّد صلاحيته من هذه الشاشة.</div>
      <ErrorNote>{error}</ErrorNote>
      <div className="rounded-lg overflow-x-auto" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <table className="w-full text-sm">
          <thead><tr style={{ borderBottom: `1px solid ${C.line}` }}>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الاسم</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الصلاحية</th>
            <th className="text-right px-4 py-3 font-bold" style={{ color: C.inkMuted }}>الحالة</th>
            <th></th>
          </tr></thead>
          <tbody>
            {staff.map((p) => {
              const isActive = p.active !== false;
              const isSelf = p.id === myId;
              return (
                <tr key={p.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                  <td className="px-4 py-3 font-bold whitespace-nowrap" style={{ color: C.ink }}>{p.display_name}{isSelf && <span className="text-xs font-normal" style={{ color: C.inkMuted }}> (أنت)</span>}</td>
                  <td className="px-4 py-3 whitespace-nowrap">
                    <select value={p.role} disabled={isSelf} onChange={(e) => changeRole(p, e.target.value)} className="px-2 py-1.5 rounded-md text-sm" style={{ ...inputStyle, opacity: isSelf ? 0.5 : 1 }}>
                      <option value="فني مختبر">فني مختبر</option>
                      <option value="مدير">مدير</option>
                    </select>
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap">{isActive ? <Badge tone="normal">نشط</Badge> : <Badge tone="critical">معطّل</Badge>}</td>
                  <td className="px-4 py-3 whitespace-nowrap">
                    <button onClick={() => toggleActive(p)} disabled={isSelf} className="text-xs font-bold" style={{ color: isActive ? C.critical : C.normal, opacity: isSelf ? 0.4 : 1 }}>{isActive ? 'تعطيل' : 'تفعيل'}</button>
                  </td>
                </tr>
              );
            })}
            {staff.length === 0 && <tr><td colSpan={4}><EmptyState text="لا يوجد موظفون بعد" /></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  const [saveError, setSaveError] = useState(false);
  const [confirmState, setConfirmState] = useState(null);

  const isManager = role === 'مدير';
  const askConfirm = (opts) => setConfirmState({ open: true, ...opts });
  const closeConfirm = () => setConfirmState(null);

  const fetchAll = async () => {
    try {
      const [pRes, cRes, oRes, invRes, invenRes, aRes, profRes, supRes, purRes, accRes, txRes, lsRes, rdRes, spRes, cpRes] = await Promise.all([
        sb.from('patients').select('*').order('created_at', { ascending: false }),
        sb.from('catalog_tests').select('*').order('created_at'),
        sb.from('orders').select('*').order('created_at', { ascending: false }),
        sb.from('invoices').select('*, payments(*)').order('created_at', { ascending: false }),
        sb.from('inventory').select('*').order('name'),
        sb.from('audit_log').select('*').order('created_at', { ascending: false }).limit(300),
        sb.from('profiles').select('*').order('created_at'),
        sb.from('suppliers').select('*').order('name'),
        sb.from('purchases').select('*, purchase_payments(*)').order('created_at', { ascending: false }),
        sb.from('accounts').select('*').order('created_at'),
        sb.from('transactions').select('*').order('created_at', { ascending: false }).limit(500),
        sb.from('lab_settings').select('*').eq('id', true).maybeSingle(),
        sb.from('referring_doctors').select('*').order('name'),
        sb.from('salary_payments').select('*').order('created_at', { ascending: false }),
        sb.from('doctor_commission_payments').select('*').order('created_at', { ascending: false }),
      ]);
      if (pRes.data) setPatients(pRes.data);
      if (cRes.data) setCatalog(cRes.data);
      if (oRes.data) setOrders(oRes.data);
      if (invRes.data) setInvoices(invRes.data);
      if (invenRes.data) setInventory(invenRes.data);
      if (aRes.data) setAuditLog(aRes.data);
      if (profRes.data) {
        setStaff(profRes.data);
        const me = profRes.data.find((p) => p.id === session.user.id);
        if (me) { setDisplayName(me.display_name); setRole(me.role); setMyActive(me.active !== false); }
      }
      if (supRes.data) setSuppliers(supRes.data);
      if (purRes.data) setPurchases(purRes.data);
      if (accRes.data) setAccounts(accRes.data);
      if (txRes.data) setTransactions(txRes.data);
      if (lsRes.data) setLabSettings(lsRes.data);
      if (rdRes.data) setReferringDoctors(rdRes.data);
      if (spRes.data) setSalaryPayments(spRes.data);
      if (cpRes.data) setCommissionPayments(cpRes.data);
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchAll();
    const channel = sb.channel('lab-changes')
      .on('postgres_changes', { event: '*', schema: 'public' }, () => fetchAll())
      .subscribe();
    return () => sb.removeChannel(channel);
  }, []);

  const actions = {
    addPatient: async (p) => { const { error } = await sb.from('patients').insert(p); if (!error) await sb.rpc('log_action', { p_user_name: displayName, p_action: 'إضافة مريض', p_details: `تسجيل: ${p.name}` }); fetchAll(); },
    updatePatient: async (id, p) => { await sb.from('patients').update(p).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تعديل مريض', p_details: `تعديل: ${p.name}` }); fetchAll(); },
    deletePatient: async (id, name) => { await sb.from('patients').delete().eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'حذف مريض', p_details: `حذف: ${name}` }); fetchAll(); },

    addOrder: async (patientId, testIds, referringDoctor) => {
      const patient = patients.find((p) => p.id === patientId);
      await sb.rpc('create_order', { p_patient_id: patientId, p_test_ids: testIds, p_user_name: displayName, p_patient_name: patient?.name || '', p_referring_doctor: referringDoctor || null });
      fetchAll();
    },
    cancelOrder: async (orderId, sampleId) => { await sb.rpc('cancel_order', { p_order_id: orderId, p_user_name: displayName, p_sample_id: sampleId }); fetchAll(); },
    completeOrder: async (orderId, results, hasCritical, sampleId) => { await sb.rpc('complete_order', { p_order_id: orderId, p_results: results, p_has_critical: hasCritical, p_user_name: displayName, p_sample_id: sampleId }); fetchAll(); },
    submitResults: async (orderId, results, hasCritical, sampleId) => { await sb.rpc('submit_results', { p_order_id: orderId, p_results: results, p_has_critical: hasCritical, p_user_name: displayName, p_sample_id: sampleId }); fetchAll(); },
    verifyResults: async (orderId, sampleId) => { await sb.rpc('verify_results', { p_order_id: orderId, p_user_name: displayName, p_sample_id: sampleId }); fetchAll(); },
    rejectResults: async (orderId, sampleId, reason) => { await sb.rpc('reject_results', { p_order_id: orderId, p_user_name: displayName, p_sample_id: sampleId, p_reason: reason || null }); fetchAll(); },

    addPayment: async (invoiceId, amount, method, accountId) => { await sb.rpc('add_payment', { p_invoice_id: invoiceId, p_amount: amount, p_method: method, p_user_name: displayName, p_account_id: accountId || null }); fetchAll(); },

    addInventory: async (item) => { await sb.from('inventory').insert(item); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'إضافة صنف مخزون', p_details: item.name }); fetchAll(); },
    updateInventory: async (id, item) => { await sb.from('inventory').update(item).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تعديل صنف مخزون', p_details: item.name }); fetchAll(); },
    deleteInventory: async (id, name) => { await sb.from('inventory').delete().eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'حذف صنف مخزون', p_details: name }); fetchAll(); },
    setQuantity: async (id, name, qty) => { await sb.from('inventory').update({ quantity: qty }).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تعديل يدوي للمخزون', p_details: `${name} → ${qty}` }); fetchAll(); },

    addTest: async (t) => { await sb.from('catalog_tests').insert(t); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'إضافة فحص', p_details: t.name }); fetchAll(); },
    updateTest: async (id, t) => { await sb.from('catalog_tests').update(t).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تعديل فحص', p_details: t.name }); fetchAll(); },
    deleteTest: async (id, name) => { await sb.from('catalog_tests').delete().eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'حذف فحص', p_details: name }); fetchAll(); },

    addSupplier: async (s) => { await sb.from('suppliers').insert(s); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'إضافة مورد', p_details: s.name }); fetchAll(); },
    updateSupplier: async (id, s) => { await sb.from('suppliers').update(s).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تعديل مورد', p_details: s.name }); fetchAll(); },
    deleteSupplier: async (id, name) => { await sb.from('suppliers').delete().eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'حذف مورد', p_details: name }); fetchAll(); },
    addPurchase: async (supplierId, items, paymentType, invoiceNo, accountId) => {
      const supplier = suppliers.find((s) => s.id === supplierId);
      await sb.rpc('create_purchase', { p_supplier_id: supplierId, p_items: items, p_payment_type: paymentType, p_invoice_no: invoiceNo || null, p_user_name: displayName, p_supplier_name: supplier?.name || '', p_account_id: accountId || null });
      fetchAll();
    },
    addPurchasePayment: async (purchaseId, amount, method, accountId) => { await sb.rpc('add_purchase_payment', { p_purchase_id: purchaseId, p_amount: amount, p_method: method, p_user_name: displayName, p_account_id: accountId || null }); fetchAll(); },

    addAccount: async (a) => { await sb.from('accounts').insert(a); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'إضافة حساب', p_details: a.name }); fetchAll(); },
    updateAccount: async (id, a) => { await sb.from('accounts').update(a).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تعديل حساب', p_details: a.name }); fetchAll(); },
    deleteAccount: async (id, name) => { await sb.from('accounts').delete().eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'حذف حساب', p_details: name }); fetchAll(); },
    addManualTransaction: async (accountId, direction, amount, category, description) => { await sb.rpc('add_manual_transaction', { p_account_id: accountId, p_direction: direction, p_amount: amount, p_category: category, p_description: description || null, p_user_name: displayName }); fetchAll(); },

    updateStaffRole: async (id, name, newRole) => { await sb.from('profiles').update({ role: newRole }).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تغيير صلاحية موظف', p_details: `${name} → ${newRole}` }); fetchAll(); },
    updateStaffActive: async (id, name, isActive) => { await sb.from('profiles').update({ active: isActive }).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: isActive ? 'تفعيل حساب موظف' : 'تعطيل حساب موظف', p_details: name }); fetchAll(); },
    updateStaffName: async (id, name) => { await sb.from('profiles').update({ display_name: name }).eq('id', id); fetchAll(); },
    updateLabSettings: async (patch) => { await sb.from('lab_settings').update({ ...patch, updated_at: new Date().toISOString() }).eq('id', true); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تعديل بيانات المختبر', p_details: '' }); fetchAll(); },

    updateStaffSalary: async (id, name, baseSalary) => { await sb.from('profiles').update({ base_salary: baseSalary }).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تعديل الراتب الأساسي', p_details: name }); fetchAll(); },
    paySalary: async (profileId, staffName, amount, accountId, period) => { await sb.rpc('pay_salary', { p_profile_id: profileId, p_staff_name: staffName, p_amount: amount, p_account_id: accountId, p_period: period || null, p_user_name: displayName }); fetchAll(); },

    addReferringDoctor: async (doc) => { await sb.from('referring_doctors').insert(doc); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'إضافة طبيب محوّل', p_details: doc.name }); fetchAll(); },
    updateReferringDoctor: async (id, doc) => { await sb.from('referring_doctors').update(doc).eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'تعديل بيانات طبيب', p_details: doc.name }); fetchAll(); },
    deleteReferringDoctor: async (id, name) => { await sb.from('referring_doctors').delete().eq('id', id); await sb.rpc('log_action', { p_user_name: displayName, p_action: 'حذف طبيب محوّل', p_details: name }); fetchAll(); },
    payDoctorCommission: async (doctorName, amount, accountId, notes) => { await sb.rpc('pay_doctor_commission', { p_doctor_name: doctorName, p_amount: amount, p_account_id: accountId, p_user_name: displayName, p_notes: notes || null }); fetchAll(); },
  };

  const exportBackup = () => {
    const payload = { exportedAt: new Date().toISOString(), patients, catalog, orders, invoices, inventory, auditLog, suppliers, purchases, accounts, transactions };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `نسخة-احتياطية-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const activeOrder = orders.find((o) => o.id === activeOrderId) || null;
  const activePatient = activeOrder ? patients.find((p) => p.id === activeOrder.patient_id) : null;
  const goToPatientOrders = (patientId) => { setPatientFilter(patientId); setView('orders'); };
  const navigate = (v) => { setPatientFilter(null); setView(v); };

  if (loading) return <div className="h-screen w-full flex items-center justify-center" style={{ background: C.bg }}><div className="text-sm" style={{ color: C.inkMuted }}>...جارِ تحميل البيانات</div></div>;

  if (!myActive) {
    return (
      <div dir="rtl" lang="ar" className="h-screen w-full flex items-center justify-center p-4" style={{ background: C.bg }}>
        <div className="w-full max-w-sm rounded-lg p-6 text-center" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="text-lg font-bold mb-2" style={{ color: C.critical }}>الحساب معطّل</div>
          <div className="text-sm mb-5" style={{ color: C.inkMuted }}>تم تعطيل هذا الحساب من قِبل الإدارة. تواصل مع مدير المختبر إذا كان هذا غير متوقع.</div>
          <button onClick={() => sb.auth.signOut()} className="w-full px-4 py-2.5 rounded-lg text-sm font-bold" style={{ background: C.accent, color: '#fff' }}>تسجيل الخروج</button>
        </div>
      </div>
    );
  }

  const historyPatient = patients.find((p) => p.id === historyPatientId) || null;
  const goToPatientHistory = (patientId) => { setHistoryPatientId(patientId); setView('history'); };
  const navigateMobile = (v) => { navigate(v); setMobileNavOpen(false); };

  return (
    <div dir="rtl" lang="ar" className="flex h-screen w-full overflow-hidden" style={{ background: C.bg }}>
      {mobileNavOpen && (
        <div className="fixed inset-0 z-40 md:hidden" style={{ background: 'rgba(28,38,34,0.5)' }} onClick={() => setMobileNavOpen(false)} />
      )}
      <div className={`no-print h-full ${mobileNavOpen ? 'fixed inset-y-0 right-0 z-50' : 'hidden'} md:static md:block md:z-auto`}>
        <Sidebar view={view} setView={navigateMobile} displayName={displayName} role={role} isManager={isManager} labName={labSettings?.name} logoSrc={labSettings?.logo_b64 || LOGO_B64} onLogout={() => sb.auth.signOut()} onExport={exportBackup} saveError={saveError} />
      </div>
      <div className="flex-1 h-full flex flex-col overflow-hidden">
        <div className="no-print md:hidden flex items-center justify-between px-4 py-3" style={{ background: C.surface, borderBottom: `1px solid ${C.line}` }}>
          <button onClick={() => setMobileNavOpen(true)} className="text-2xl leading-none px-1" style={{ color: C.ink }}>☰</button>
          <div className="font-bold text-sm" style={{ color: C.ink }}>{labSettings?.name || 'مختبر الشموخ'}</div>
          <div style={{ width: 24 }} />
        </div>
        <main className="flex-1 overflow-y-auto">
          {view === 'dashboard' && <Dashboard data={{ patients, catalog, orders, invoices, inventory, auditLog }} setView={setView} setActiveOrderId={setActiveOrderId} />}
          {view === 'patients' && <PatientsView patients={patients} orders={orders} actions={actions} askConfirm={askConfirm} onViewOrders={goToPatientOrders} onViewHistory={goToPatientHistory} isManager={isManager} />}
          {view === 'orders' && <OrdersView patients={patients} catalog={catalog} orders={orders} inventory={inventory} actions={actions} setView={setView} setActiveOrderId={setActiveOrderId} filterPatientId={patientFilter} clearFilter={() => setPatientFilter(null)} askConfirm={askConfirm} isManager={isManager} />}
          {view === 'results' && <ResultsEntryView order={activeOrder} patient={activePatient} catalog={catalog} actions={actions} setView={setView} />}
          {view === 'report' && <ReportView order={activeOrder} patient={activePatient} catalog={catalog} setView={setView} labSettings={labSettings} />}
          {view === 'history' && <PatientHistoryView patient={historyPatient} orders={orders} catalog={catalog} setView={setView} />}
          {view === 'inventory' && <InventoryView inventory={inventory} catalog={catalog} actions={actions} askConfirm={askConfirm} />}
          {view === 'suppliers' && <SuppliersView suppliers={suppliers} purchases={purchases} inventory={inventory} accounts={accounts} actions={actions} askConfirm={askConfirm} isManager={isManager} />}
          {view === 'treasury' && isManager && <TreasuryView accounts={accounts} transactions={transactions} staff={staff} salaryPayments={salaryPayments} actions={actions} askConfirm={askConfirm} isManager={isManager} />}
          {view === 'financial-reports' && isManager && <FinancialReportsView accounts={accounts} transactions={transactions} invoices={invoices} purchases={purchases} orders={orders} referringDoctors={referringDoctors} commissionPayments={commissionPayments} actions={actions} />}
          {view === 'billing' && <BillingView invoices={invoices} orders={orders} patients={patients} accounts={accounts} actions={actions} />}
          {view === 'audit' && <AuditLogView auditLog={auditLog} />}
          {view === 'settings' && <SettingsView catalog={catalog} inventory={inventory} orders={orders} actions={actions} askConfirm={askConfirm} isManager={isManager} staff={staff} myId={session.user.id} labSettings={labSettings} />}
        </main>
      </div>
      <ConfirmDialog state={confirmState} onCancel={closeConfirm} />
    </div>
  );
}

// ---------------------------------------------------------------------------
// Root: auth gate
// ---------------------------------------------------------------------------
function Root() {
  const [session, setSession] = useState(undefined); // undefined = still checking

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => listener.subscription.unsubscribe();
  }, []);

  if (session === undefined) return <div className="h-screen w-full flex items-center justify-center" style={{ background: C.bg }}><div className="text-sm" style={{ color: C.inkMuted }}>...جارِ التحقق من الدخول</div></div>;
  if (!session) return <LoginScreen />;
  return <AppShell key={session.user.id} session={session} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
