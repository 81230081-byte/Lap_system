<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة مختبر الشموخ الطبي</title>

  <!-- التنسيقات والمكتبات الأساسية -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- تنسيقات الطباعة -->
  <style>
    @media print {
      .no-print { display: none !important; }
      body * { visibility: hidden; }
      .printable-area, .printable-area *, #report-area, #report-area * { visibility: visible; }
      .printable-area, #report-area { position: absolute; top: 0; right: 0; left: 0; width: 100%; border: none !important; }
      .hidden.print\:block { display: block !important; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">

  <!-- شاشة تنبيه الأخطاء لتظهر فوراً على شاشة الأيفون -->
  <div id="debug-box" style="display:none;" class="m-4 p-4 bg-red-100 border-2 border-red-500 text-red-800 rounded-lg text-left font-mono text-sm dir-ltr whitespace-pre-wrap overflow-auto max-h-96"></div>

  <!-- مكان عرض التطبيق -->
  <div id="root"></div>

  <!-- سكريبت الدمج والتشغيل الموحد -->
  <script>
    // التقاط أي خطأ عام يحدث أثناء تشغيل React وإظهاره فوراً
    window.addEventListener('error', function(e) {
      const debugBox = document.getElementById('debug-box');
      if (debugBox) {
        debugBox.style.display = 'block';
        debugBox.innerHTML += `<br><b style="color:red">[خطأ أثناء التشغيل]:</b> ${e.message} <br><small>في الملف/السطر: ${e.filename}:${e.lineno}</small>`;
      }
    });

    async function launchApp() {
      // قائمة كافة ملفات النظام
      const files = [
        '01-config.js',
        '02-helpers.js',
        '03-ui-kit.jsx',
        '04-login.jsx',
        '05-layout.jsx',
        '06-dashboard.jsx',
        '07-patients.jsx',
        '08-orders-results.jsx',
        '09-inventory.jsx',
        '10-suppliers-purchases.jsx',
        '11-treasury.jsx',
        '12-financial-reports.jsx',
        '13-ledger-and-coa.jsx',
        '14-billing.jsx',
        '15-audit-log.jsx',
        '16-settings.jsx',
        '17-app-shell.jsx',
        '19-appointments.jsx',
        '21-quality-control.jsx',
        '20-main.jsx'
      ];

      const debugBox = document.getElementById('debug-box');

      try {
        let combinedCode = `
          // بيئة وهمية لمنع أخطاء التصدير والاستيراد
          var exports = {};
          var module = { exports: exports };
        `;

        // جلب وقراءة كافة الملفات
        for (const file of files) {
          const response = await fetch('./' + file + '?v=' + Date.now());
          if (!response.ok) {
            throw new Error(`تعذر تحميل الملف: ${file} (رمز الخطأ: ${response.status})`);
          }
          let text = await response.text();
          
          // تنظيف كلمات import و export لتفادي تعطيل المتصفح
          text = text.replace(/^\s*import\s+.*?;?/gm, '// import removed');
          text = text.replace(/^\s*export\s+default\s+/gm, 'window.');
          text = text.replace(/^\s*export\s+/gm, '');

          combinedCode += `\n/* --- File: ${file} --- */\n` + text;
        }

        // تحويل الكود المدمج عبر Babel
        const transpiledCode = Babel.transform(combinedCode, {
          presets: ['react']
        }).code;

        // تنفيذ الكود داخل المتصفح
        const scriptElement = document.createElement('script');
        scriptElement.text = transpiledCode;
        document.body.appendChild(scriptElement);

      } catch (err) {
        debugBox.style.display = 'block';
        debugBox.innerHTML = `<b style="color:red">فشل تشغيل النظام:</b><br><br>${err.message}`;
      }
    }

    // بدء التشغيل عند اكتمال تحميل الصفحة
    window.addEventListener('DOMContentLoaded', launchApp);
  </script>
</body>
</html>
