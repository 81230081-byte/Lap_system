<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="مختبر الشموخ" />
<title>مختبر الشموخ — نظام إدارة المختبر</title>

<!-- Tailwind (بدون خطوة بناء — مناسب لأداة داخلية صغيرة) -->
<script crossorigin="anonymous" src="https://cdn.tailwindcss.com"></script>
<!-- React + Babel (بدون خطوة بناء) -->
<script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Supabase client -->
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
  @media print {
    .no-print { display: none !important; }
    body * { visibility: hidden; }
    #report-area, #report-area * { visibility: visible; }
    #report-area { position: absolute; top: 0; right: 0; left: 0; width: 100%; border: none !important; }
  }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script>
function showFatalError(title, detail) {
  var root = document.getElementById('root');
  if (!root) return;
  root.innerHTML =
    '<div style="padding:24px;font-family:monospace;direction:ltr;text-align:left;white-space:pre-wrap;color:#b3402a;font-size:13px;line-height:1.6;max-width:700px;margin:0 auto">' +
    '⚠ ' + title + '\n\n' + (detail || '(بدون تفاصيل إضافية)') +
    '\n\n---\nجرّب تحديث الصفحة بقوة (Ctrl+Shift+R أو امسح الكاش)، وإن استمر الخطأ أرسل لقطة لهذه الرسالة كاملة.' +
    '</div>';
}
window.onerror = function (msg, url, line, col, error) {
  var detail = 'الرسالة: ' + msg + '\nالملف: ' + (url || '—') + '\nالسطر: ' + line + ':' + col;
  if (error && error.stack) detail += '\n\nStack:\n' + error.stack;
  showFatalError('حدث خطأ برمجي', detail);
};
window.addEventListener('unhandledrejection', function (e) {
  var reason = e.reason;
  var detail = 'الرسالة: ' + (reason && reason.message ? reason.message : String(reason));
  if (reason && reason.stack) detail += '\n\nStack:\n' + reason.stack;
  showFatalError('حدث خطأ غير متوقع (Promise)', detail);
});
</script>

<!--
  كل ملف تحت src/ جزء من نفس التطبيق (بدون import/export — كلها تشترك
  بنفس النطاق العام في المتصفح). الترتيب أدناه مهم: كل ملف قد يعتمد على
  ما قبله، فلا تُغيّر الترتيب عند إضافة ملفات إلا إذا تأكدت من عدم وجود اعتماد.
-->
