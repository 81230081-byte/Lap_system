<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>الاستعلام عن نتيجة الفحص — مختبر الشموخ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg:#F5F6F2; --surface:#FFFFFF; --ink:#1C2622; --ink-muted:#5B665F; --line:#E1E4DD;
    --accent:#2B6472; --accent-dark:#1E4B56; --accent-soft:#E4EEEF;
    --normal:#3F7A52; --normal-soft:#E6F0E7; --warning:#B8842C; --warning-soft:#F5EBD8;
    --critical:#B3402A; --critical-soft:#F5E2DD;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  header { text-align:center; margin-bottom: 22px; }
  header .lab-name { font-size: 22px; font-weight: 800; color: var(--accent-dark); }
  header .sub { font-size: 13px; color: var(--ink-muted); margin-top: 2px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  label { display:block; font-size: 13px; font-weight: 700; color: var(--ink-muted); margin: 14px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input { width:100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; font-family: inherit; background:#fff; color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { width:100%; margin-top: 18px; padding: 12px; border: none; border-radius: 10px; background: var(--accent); color:#fff; font-size: 15px; font-weight: 800; cursor:pointer; }
  button.primary:disabled { opacity: .6; cursor: default; }
  button.primary:hover:not(:disabled) { background: var(--accent-dark); }
  .msg { margin-top: 16px; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 700; line-height: 1.7; }
  .msg.error { background: var(--critical-soft); color: var(--critical); }
  .msg.info { background: var(--accent-soft); color: var(--accent-dark); }
  .hidden { display:none !important; }

  .report { margin-top: 18px; }
  .report .head { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; padding-bottom:14px; margin-bottom:14px; border-bottom: 1px solid var(--line); }
  .report .patient-name { font-size: 18px; font-weight: 800; }
  .report .meta { font-size: 12.5px; color: var(--ink-muted); line-height:1.9; }
  .critical-banner { background: var(--critical-soft); color: var(--critical); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; font-weight: 700; line-height:1.7; margin-bottom: 16px; }
  table { width:100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align:right; color: var(--ink-muted); font-weight:700; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
  td { padding: 9px 6px; border-bottom: 1px solid var(--line); }
  .flag { display:inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; }
  .flag.normal { background: var(--normal-soft); color: var(--normal); }
  .flag.abnormal { background: var(--warning-soft); color: var(--warning); }
  .flag.critical { background: var(--critical-soft); color: var(--critical); }
  .disclaimer { margin-top:16px; font-size: 12px; color: var(--ink-muted); text-align:center; line-height:1.8; }
  .print-btn { margin-top:14px; width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--accent); font-weight:700; font-size:14px; cursor:pointer; }
  @media print {
    .no-print { display:none !important; }
    body { background:#fff; }
    .card { border:none; padding:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lab-name">مختبر الشموخ</div>
    <div class="sub">الاستعلام عن نتيجة الفحص</div>
  </header>

  <div class="card">
    <form id="lookup-form" class="no-print">
      <label for="sample-id">رقم العينة (موجود على إيصالك)</label>
      <input id="sample-id" autocomplete="off" required />
      <label for="phone">رقم الهاتف المسجَّل لدى المختبر</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="off" required />
      <button type="submit" class="primary" id="submit-btn">عرض النتيجة</button>
    </form>
    <div id="message" class="hidden"></div>
    <div id="report" class="report hidden"></div>
  </div>

  <div class="disclaimer">هذه الصفحة لعرض النتيجة فقط ولا تُغني عن استشارة الطبيب المعالج لتفسيرها.</div>
</div>

<script>
const SUPABASE_URL = "https://dkdgexaupclewflwyyrl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_V6XY4M4LoNEMhxWO3DCV7w_SDUI8_az";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById('lookup-form');
const submitBtn = document.getElementById('submit-btn');
const messageEl = document.getElementById('message');
const reportEl = document.getElementById('report');

function showMessage(text, type) {
  messageEl.textContent = text;
  messageEl.className = 'msg ' + type;
  reportEl.className = 'report hidden';
}

function resolveRange(test, gender) {
  const useFemale = gender === 'أنثى' && test.min_female !== null && test.min_female !== undefined;
  const min = useFemale ? test.min_female : test.min;
  const max = useFemale ? test.max_female : test.max;
  const span = (test.max - test.min) || 1;
  const critLow = (test.critical_low !== null && test.critical_low !== undefined) ? test.critical_low : min - span * 0.5;
  const critHigh = (test.critical_high !== null && test.critical_high !== undefined) ? test.critical_high : max + span * 0.5;
  return { min, max, critLow, critHigh };
}
function classifyValue(value, r) {
  if (value === '' || value === undefined || value === null || isNaN(value)) return null;
  if (value < r.critLow || value > r.critHigh) return 'critical';
  if (value < r.min || value > r.max) return 'abnormal';
  return 'normal';
}
const FLAG_LABEL = { normal: 'طبيعي', abnormal: 'خارج المعدل', critical: 'حرج' };
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' });
}
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function renderReport(data) {
  const rowsHtml = (data.tests || []).map((t) => {
    const r = resolveRange(t, data.patient_gender);
    const flag = classifyValue(t.value, r);
    const rangeLabel = (r.min != null && r.max != null) ? `${r.min} – ${r.max}` : '—';
    return `<tr>
      <td>${esc(t.name)}</td>
      <td style="font-weight:800;font-family:ui-monospace,monospace">${t.value != null && !isNaN(t.value) ? t.value : '—'} <span style="color:var(--ink-muted);font-weight:400">${esc(t.unit || '')}</span></td>
      <td style="color:var(--ink-muted);font-family:ui-monospace,monospace">${rangeLabel}</td>
      <td>${flag ? `<span class="flag ${flag}">${FLAG_LABEL[flag]}</span>` : '—'}</td>
    </tr>`;
  }).join('');

  reportEl.innerHTML = `
    ${data.has_critical ? `<div class="critical-banner">⚠ يحتوي هذا التقرير على قيمة تستدعي انتباهاً طبياً — يُرجى مراجعة الطبيب المعالج في أقرب وقت.</div>` : ''}
    <div class="head">
      <div>
        <div class="patient-name">${esc(data.patient_name)}</div>
        <div class="meta">${esc(data.patient_gender || '')} ${data.patient_age != null ? '— ' + esc(data.patient_age) + ' سنة' : ''}</div>
      </div>
      <div class="meta">
        رقم العينة: ${esc(data.sample_id)}<br/>
        تاريخ الاعتماد: ${fmtDate(data.verified_at)}
        ${data.referring_doctor ? '<br/>الطبيب المحوِّل: ' + esc(data.referring_doctor) : ''}
      </div>
    </div>
    <table>
      <thead><tr><th>الفحص</th><th>النتيجة</th><th>المعدل الطبيعي</th><th>الحالة</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <button class="print-btn no-print" onclick="window.print()">طباعة / حفظ PDF</button>
  `;
  reportEl.className = 'report';
  messageEl.className = 'msg hidden';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const sampleId = document.getElementById('sample-id').value.trim();
  const phone = document.getElementById('phone').value.trim();
  if (!sampleId || !phone) return;

  submitBtn.disabled = true;
  submitBtn.textContent = 'جارٍ البحث...';
  reportEl.className = 'report hidden';
  messageEl.className = 'msg hidden';

  try {
    const { data, error } = await sb.rpc('public_lookup_result', { p_sample_id: sampleId, p_phone: phone });
    if (error) {
      showMessage('تعذّر الاتصال بالخادم، حاول مرة أخرى بعد قليل.', 'error');
    } else if (!data || !data.found) {
      showMessage('لم يتم العثور على نتيجة بهذه البيانات. تأكد من رقم العينة ورقم الهاتف المسجَّل، أو أن نتيجتك قد لا تكون جاهزة بعد.', 'info');
    } else {
      renderReport(data);
    }
  } catch (err) {
    showMessage('تعذّر الاتصال بالخادم، تحقق من اتصالك بالإنترنت وحاول مرة أخرى.', 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'عرض النتيجة';
  }
});
</script>
</body>
</html>
